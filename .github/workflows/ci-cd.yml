name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'
  DOCKER_BUILDKIT: 1

jobs:
  # Security Scanning
  security-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run gitleaks secret scan (working tree)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: >-
            detect
            --source .
            --no-git
            --redact
            --config .gitleaks.toml

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@0.4.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=docker/frontend/package.json

  # Code Quality Checks
  code-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd docker
          pnpm install

      - name: Guard against Authentik references in runtime/config paths
        run: |
          set -euo pipefail
          FORBIDDEN_REGEX='(Authentik|AUTHENTIK_)'
          TARGETS=(
            "docker/backend/src"
            "docker/frontend/src"
            "docker/core"
            "docker/compose"
            "docker/apisix"
            "docker/compliance"
            "docker/observability"
            "docker/security"
          )

          MATCHES=$(grep -RInE "$FORBIDDEN_REGEX" "${TARGETS[@]}" \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.sql' \
            --include='*.yml' --include='*.yaml' --include='*.env' --include='*.sh' || true)

          if [ -n "$MATCHES" ]; then
            echo "❌ Forbidden Authentik references detected in runtime/config paths:"
            echo "$MATCHES"
            exit 1
          fi

          echo "✅ No forbidden Authentik references found in guarded runtime/config paths"

      - name: Run ESLint
        run: |
          cd docker
          pnpm lint

      - name: Run TypeScript type checking
        run: |
          cd docker
          pnpm typecheck

      - name: Run Prettier check
        run: |
          cd docker
          pnpm format:check

  # Unit Tests
  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd docker
          pnpm install

      - name: Run unit tests
        run: |
          cd docker
          pnpm test:unit
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./docker/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  # Integration Tests
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092

      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - name: Install dependencies
        run: |
          cd docker
          pnpm install

      - name: Run database migrations
        run: |
          cd docker
          pnpm migrate:test

      - name: Run integration tests
        run: |
          cd docker
          pnpm test:integration
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          KAFKA_BROKERS: localhost:9092

  # Gateway Smoke Tests (APISIX + ETCD)
  # Validates critical routing + auth UX through the gateway using a lightweight mock upstream.
  gateway-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate self-signed TLS cert for APISIX (CI only)
        run: |
          set -euo pipefail
          mkdir -p docker/compose/ci/certs
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout docker/compose/ci/certs/server.key \
            -out docker/compose/ci/certs/server.crt \
            -subj "/CN=localhost"
          chmod 644 docker/compose/ci/certs/server.key docker/compose/ci/certs/server.crt

      - name: Start gateway smoke stack
        run: |
          set -euo pipefail
          docker compose -f docker/compose/ci/gateway-smoke.yml up -d --build
          # Run idempotent APISIX route initializer (writes to etcd)
          docker compose -f docker/compose/ci/gateway-smoke.yml run --rm apisix-init

      - name: Run gateway smoke checks
        run: |
          set -euo pipefail
          BASE_URL="https://localhost:8443" bash docker/scripts/gateway-smoke-test.sh

      - name: Teardown gateway smoke stack
        if: always()
        run: |
          docker compose -f docker/compose/ci/gateway-smoke.yml down -v

  # E2E Tests
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        run: |
          cd docker/frontend
          pnpm playwright:install

      - name: Run E2E tests
        run: |
          cd docker/frontend
          pnpm test:e2e
        env:
          BASE_URL: http://localhost:3000

  # Performance Tests
  performance-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Artillery
        run: pnpm add -g artillery

      - name: Run performance tests
        run: |
          artillery run tests/load/load-test.yml --output reports/performance.json

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: reports/

  # Build and Push Docker Images
  build-and-push:
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, unit-tests, integration-tests, e2e-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: thaliumx/backend,thaliumx/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: docker/frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add staging deployment commands here

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add production deployment commands here

  # Rollback Plan
  rollback:
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Rollback deployment
        run: |
          echo "Rolling back deployment..."
          # Add rollback commands here
