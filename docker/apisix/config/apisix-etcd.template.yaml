# ThaliumX APISIX configuration (ETCD-backed, persistent)
# ======================================================
# This is a TEMPLATE file.
# - The gateway compose entrypoint replaces __APISIX_ADMIN_KEY__ at runtime
#   using the Docker secret value.
# - Routes/upstreams/ssl objects are created via the init script and stored in ETCD.

apisix:
  node_listen: 9080
  enable_ipv6: false

  # DNS resolver (critical when upstream nodes are Docker service names)
  # Without this, Nginx can resolve a container name once at startup and keep a stale IP,
  # causing 502/connection refused after the upstream container is recreated.
  dns_resolver:
    - 127.0.0.11
    - 1.1.1.1
    - 8.8.8.8
  dns_resolver_valid: 30

  # Public data-plane ports (published via docker/compose/prod-v1/gateway.yml)
  ssl:
    enable: true
    listen:
      # Bind to the standard HTTPS port inside the container.
      # This avoids incorrect redirects such as https://host:9443 when APISIX is published on :443.
      - port: 443
    # Default certificate (SNI-specific certs can also be created via the Admin API and stored in ETCD)
    ssl_certificate: /tmp/certs/server.crt
    ssl_certificate_key: /tmp/certs/server.key
    ssl_protocols: "TLSv1.2 TLSv1.3"

  enable_admin: true
  # Admin API is NOT published to the host; it is only reachable on the Docker network.
  # NOTE: In APISIX 3.11+ the Admin API access-control is configured under deployment.admin.
  admin_listen:
    ip: 0.0.0.0
    port: 9180

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  etcd:
    host:
      - "http://thaliumx-etcd:2379"
    prefix: /apisix
    timeout: 30

  # Admin API security (used by APISIX 3.11+)
  admin:
    admin_key_required: true
    admin_key:
      - name: admin
        key: "__APISIX_ADMIN_KEY__"
        role: admin
    # Restrict Admin API by source IP (Docker networks + localhost).
    # Adjust these CIDRs to match your actual docker network(s).
    allow_admin:
      - 127.0.0.1/32
      - 172.16.0.0/12
      - 10.0.0.0/8
      - 192.168.0.0/16

plugins:
  # Core
  - cors
  - proxy-rewrite
  - redirect
  - request-id
  - prometheus
  - limit-req
  - limit-count

  # Auth/Policy (available for future hardening)
  - jwt-auth
  - key-auth
  - openid-connect
  - opa

nginx_config:
  error_log: /dev/stderr
  error_log_level: warn
  http:
    # PRODUCTION TLS HARDENING
    # ------------------------
    # Trust the internal CA and verify upstream TLS for HTTPS upstreams like Keycloak.
    proxy_ssl_trusted_certificate: /usr/local/apisix/certs/ca.crt
    proxy_ssl_verify: "on"
    proxy_ssl_verify_depth: 2
    proxy_ssl_server_name: "on"

    # Lua TLS trust (used by plugins that make outbound HTTPS calls, e.g. openid-connect discovery).
    lua_ssl_trusted_certificate: /usr/local/apisix/certs/ca.crt
    lua_ssl_verify_depth: 2
    enable_access_log: true
    access_log: /dev/stdout
    access_log_format: '{"time":"$time_iso8601","remote_addr":"$remote_addr","x_forwarded_for":"$http_x_forwarded_for","request_id":"$request_id","request":"$request","status":$status,"request_time":$request_time,"upstream_response_time":"$upstream_response_time","upstream_addr":"$upstream_addr","host":"$host","user_agent":"$http_user_agent"}'
    access_log_format_escape: json
