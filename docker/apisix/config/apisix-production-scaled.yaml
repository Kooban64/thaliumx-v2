#
# APISIX Production Scaled Configuration for ThaliumX Platform
# =====================================================
# This configuration is optimized for scaled deployment with:
# - Advanced rate limiting for 100k+ users
# - Load balancing across multiple backend instances
# - Enhanced security and performance
# - Comprehensive monitoring and logging

apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_admin: true
  enable_http2: true

  # PRODUCTION: Restrict admin access to internal network only
  allow_admin:
    - 172.28.0.0/16  # Docker internal network only
    - 127.0.0.1/32   # Localhost only

  admin_listen:
    ip: 127.0.0.1  # PRODUCTION: Only listen on localhost
    port: 9180

  # Admin API key - Retrieved from Vault at runtime
  admin_key:
    - name: admin
      key: "${APISIX_ADMIN_KEY}"
      role: admin

  # SSL configuration - PRODUCTION: Enable TLS
  ssl:
    enable: true
    listen:
      - port: 9443
        enable_http2: true
    ssl_protocols: "TLSv1.2 TLSv1.3"
    ssl_ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
    ssl_session_tickets: false

  # Proxy settings
  proxy_mode: http&stream
  stream_proxy:
    tcp:
      - 9100

  # Router configuration
  router:
    http: radixtree_uri
    ssl: radixtree_sni

  # DNS resolver
  dns_resolver:
    - 127.0.0.11
    - 8.8.8.8
    - 8.8.4.4
  dns_resolver_valid: 30

# etcd configuration
deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  etcd:
    host:
      - "https://thaliumx-etcd:2379"
    prefix: /apisix
    timeout: 30
    tls:
      cert: /usr/local/apisix/certs/apisix.crt
      key: /usr/local/apisix/certs/apisix.key
      verify: true
      ca: /usr/local/apisix/certs/ca.crt

# Plugin configuration - Production scaled optimized
plugins:
  # Security plugins
  - api-breaker
  - authz-keycloak
  - basic-auth
  - consumer-restriction
  - cors
  - csrf
  - hmac-auth
  - ip-restriction
  - jwt-auth
  - key-auth
  - opa
  - openid-connect
  - referer-restriction
  - ua-restriction
  - uri-blocker

  # Rate limiting plugins (enhanced for scale)
  - limit-conn
  - limit-count
  - limit-req

  # Traffic management
  - proxy-cache
  - proxy-mirror
  - proxy-rewrite
  - redirect
  - response-rewrite
  - traffic-split
  - request-id
  - proxy-next-upstream

  # Observability plugins
  - http-logger
  - kafka-logger
  - prometheus
  - request-id
  - syslog
  - tcp-logger
  - zipkin

  # Utility plugins
  - batch-requests
  - echo
  - fault-injection
  - grpc-transcode
  - node-status
  - request-validation
  - serverless-post-function
  - serverless-pre-function

# Nginx configuration - Production scaled optimized
nginx_config:
  error_log: /dev/stderr
  error_log_level: warn
  worker_processes: auto
  worker_rlimit_nofile: 1048576

  event:
    worker_connections: 1048576
    use: epoll
    multi_accept: "on"

  http:
    enable_access_log: true
    access_log: /dev/stdout
    access_log_format: '{"time": "$time_iso8601", "remote_addr": "$remote_addr", "x_forwarded_for": "$http_x_forwarded_for", "request_id": "$request_id", "request": "$request", "status": "$status", "body_bytes_sent": "$body_bytes_sent", "request_time": "$request_time", "upstream_response_time": "$upstream_response_time", "upstream_addr": "$upstream_addr", "host": "$host", "user_agent": "$http_user_agent", "referer": "$http_referer"}'
    access_log_format_escape: json

    # Timeouts - optimized for scale
    keepalive_timeout: 75s
    client_header_timeout: 60s
    client_body_timeout: 60s
    send_timeout: 60s

    # Buffer sizes - increased for scale
    client_body_buffer_size: 128k
    client_max_body_size: 50m
    client_header_buffer_size: 1k
    large_client_header_buffers: 4 16k

    # Proxy settings - optimized for multiple backends
    proxy_buffer_size: 8k
    proxy_buffers: 16 8k
    proxy_busy_buffers_size: 16k
    proxy_connect_timeout: 10s
    proxy_send_timeout: 30s
    proxy_read_timeout: 30s
    proxy_next_upstream: error timeout invalid_header http_500 http_502 http_503 http_504
    proxy_next_upstream_tries: 3

    # Security headers
    underscores_in_headers: "on"
    real_ip_header: X-Forwarded-For
    real_ip_recursive: "on"
    real_ip_from:
      - 127.0.0.1
      - "unix:"
      - 172.28.0.0/16
      - 10.0.0.0/8

    # Gzip compression - optimized
    gzip: "on"
    gzip_min_length: 1024
    gzip_comp_level: 6
    gzip_types: "text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-font-ttf application/vnd.ms-fontobject image/svg+xml"
    gzip_vary: "on"
    gzip_disable: "msie6"

    # Additional security
    server_tokens: "off"
    limit_req_zone: "$binary_remote_addr" zone=api:10m rate=100r/s
    limit_req_zone: "$binary_remote_addr" zone=auth:10m rate=10r/s
    limit_req_zone: "$binary_remote_addr" zone=trading:10m rate=1000r/s

# Discovery configuration for service mesh
discovery:
  dns:
    servers:
      - "127.0.0.11:53"

# Prometheus metrics - Production scaled configuration
plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
    export_addr:
      ip: 127.0.0.1
      port: 9091
    metric_prefix: apisix_

  # Zipkin tracing configuration - optimized for scale
  zipkin:
    endpoint: http://thaliumx-jaeger:9411/api/v2/spans
    sample_ratio: 0.05  # Sample 5% of requests in scaled production
    service_name: thaliumx-apisix

  # Kafka logger configuration - optimized for scale
  kafka-logger:
    broker_list:
      - thaliumx-kafka-1:9092
      - thaliumx-kafka-2:9092
      - thaliumx-kafka-3:9092
    kafka_topic: thaliumx-access-logs
    producer_type: async
    required_acks: 1
    buffer_duration: 30
    max_retry_count: 3
    batch_max_size: 1048576

  # Request ID configuration
  request-id:
    header_name: X-Request-Id
    include_in_response: true
    algorithm: uuid

# Upstream configurations for load balancing
upstreams:
  # Backend upstream with 4 instances
  - id: backend-upstream
    type: roundrobin
    nodes:
      "backend-1:3002": 100
      "backend-2:3003": 100
      "backend-3:3004": 100
      "backend-4:3005": 100
    checks:
      active:
        type: http
        host: "127.0.0.1"
        port: 3002
        http_path: "/health"
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          failures: 3

  # Frontend upstream with 2 instances
  - id: frontend-upstream
    type: roundrobin
    nodes:
      "frontend-1:3000": 100
      "frontend-2:3000": 100
    checks:
      active:
        type: http
        host: "127.0.0.1"
        port: 3000
        http_path: "/api/health"
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          failures: 3

# Global rules - Applied to all routes (scaled production)
global_rules:
  # Global rate limiting - very permissive for authenticated users
  - id: global-rate-limit
    plugins:
      limit-count:
        count: 10000
        time_window: 60
        rejected_code: 429
        key: "remote_addr"
        policy: "redis"
        redis_host: "redis-master"
        redis_port: 6379
        redis_password: "${REDIS_PASSWORD}"

  # Global security headers
  - id: global-security-headers
    plugins:
      response-rewrite:
        headers:
          set:
            X-Frame-Options: "DENY"
            X-Content-Type-Options: "nosniff"
            X-XSS-Protection: "1; mode=block"
            Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"
            Referrer-Policy: "strict-origin-when-cross-origin"

  # Global CORS
  - id: global-cors
    plugins:
      cors:
        allow_origins: "https://thaliumx.com,https://api.thaliumx.com,https://auth.thaliumx.com"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-API-Key,X-Request-ID"
        expose_headers: "X-Request-ID"
        max_age: 86400

# Routes configuration (examples for scaled deployment)
# These would be configured via Admin API in production
routes:
  # Health check - no rate limiting
  - uri: "/health"
    upstream_id: backend-upstream
    plugins:
      prometheus: {}

  # API routes with rate limiting
  - uri: "/api/*"
    upstream_id: backend-upstream
    plugins:
      limit-count:
        count: 1000
        time_window: 60
        rejected_code: 429
        key: "consumer_name"
      jwt-auth:
        cookie: "thaliumx_token"
      prometheus: {}

  # Trading routes - higher rate limits
  - uri: "/api/trading/*"
    upstream_id: backend-upstream
    plugins:
      limit-count:
        count: 5000
        time_window: 60
        rejected_code: 429
        key: "consumer_name"
      jwt-auth:
        cookie: "thaliumx_token"
      prometheus: {}

  # Authentication routes - lower rate limits
  - uri: "/api/auth/*"
    upstream_id: backend-upstream
    plugins:
      limit-count:
        count: 10
        time_window: 60
        rejected_code: 429
        key: "remote_addr"
      prometheus: {}

  # Frontend routes
  - uri: "/*"
    upstream_id: frontend-upstream
    plugins:
      limit-count:
        count: 1000
        time_window: 60
        rejected_code: 429
        key: "remote_addr"
      prometheus: {}