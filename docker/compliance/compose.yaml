# ThaliumX Compliance Services Stack
# Docker Compose configuration for all compliance microservices

services:
  # ==================== CEX COMPLIANCE SERVICE ====================
  compliance-cex:
    build:
      context: ../compliance-cex
      dockerfile: Dockerfile
    container_name: thaliumx-compliance-cex
    restart: unless-stopped
    # Remove external port exposure - accessed via reverse proxy
    expose:
      - "3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - SERVICE_NAME=cex-compliance-service
      - PORT=3001
      - DATABASE_HOST=thaliumx-postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=cex_compliance
      - DATABASE_USER=${DB_USER:-thaliumx}
      # No insecure defaults; must be provided via env/secret manager
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DATABASE_SSL=${DB_SSL:-false}
      - REDIS_HOST=thaliumx-redis
      - REDIS_PORT=6379
      # No insecure defaults; must be provided via env/secret manager
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_DB=0
      - KAFKA_BROKERS=thaliumx-kafka:9092
      - KAFKA_CLIENT_ID=cex-compliance-service
      - KAFKA_GROUP_ID=cex-compliance-group
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - API_KEY=${API_KEY:?API_KEY is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    networks:
      - thaliumx-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.compliance-cex.rule=PathPrefix(`/api/compliance/cex`)"
      - "traefik.http.services.compliance-cex.loadbalancer.server.port=3001"

  # ==================== DEX COMPLIANCE SERVICE ====================
  compliance-dex:
    build:
      context: ../compliance-dex
      dockerfile: Dockerfile
    container_name: thaliumx-compliance-dex
    restart: unless-stopped
    # Remove external port exposure - accessed via reverse proxy
    expose:
      - "3002"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - SERVICE_NAME=dex-compliance-service
      - PORT=3002
      - DB_HOST=thaliumx-postgres
      - DB_PORT=5432
      - DB_NAME=dex_compliance
      - DB_USER=${DB_USER:-thaliumx}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DB_SSL=${DB_SSL:-false}
      - DATABASE_HOST=thaliumx-postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=dex_compliance
      - DATABASE_USER=${DB_USER:-thaliumx}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DATABASE_SSL=false
      - DATABASE_SSL_MODE=disable
      - REDIS_HOST=thaliumx-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_DB=1
      - KAFKA_BROKERS=thaliumx-kafka:9092
      - KAFKA_CLIENT_ID=dex-compliance-service
      - KAFKA_GROUP_ID=dex-compliance-group
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - API_KEY=${API_KEY:?API_KEY is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      # Blockchain RPC providers must be injected from a secrets manager / CI.
      - BLOCKCHAIN_PROVIDERS=${BLOCKCHAIN_PROVIDERS:?BLOCKCHAIN_PROVIDERS is required}
    networks:
      - thaliumx-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.compliance-dex.rule=PathPrefix(`/api/compliance/dex`)"
      - "traefik.http.services.compliance-dex.loadbalancer.server.port=3002"

  # ==================== NFT COMPLIANCE SERVICE ====================
  compliance-nft:
    build:
      context: ../compliance-nft
      dockerfile: Dockerfile
    container_name: thaliumx-compliance-nft
    restart: unless-stopped
    # Remove external port exposure - accessed via reverse proxy
    expose:
      - "3003"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - SERVICE_NAME=nft-compliance-service
      - PORT=3003
      - DB_HOST=thaliumx-postgres
      - DB_PORT=5432
      - DB_NAME=nft_compliance
      - DB_USER=${DB_USER:-thaliumx}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DB_SSL=${DB_SSL:-false}
      - REDIS_HOST=thaliumx-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_DB=2
      - KAFKA_BROKERS=thaliumx-kafka:9092
      - KAFKA_CLIENT_ID=nft-compliance-service
      - KAFKA_GROUP_ID=nft-compliance-group
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CONTENT_SCREENING_ENABLED=${CONTENT_SCREENING_ENABLED:-true}
      - WASH_TRADING_DETECTION_ENABLED=${WASH_TRADING_DETECTION_ENABLED:-true}
      - API_KEY=${API_KEY:?API_KEY is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    networks:
      - thaliumx-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.compliance-nft.rule=PathPrefix(`/api/compliance/nft`)"
      - "traefik.http.services.compliance-nft.loadbalancer.server.port=3003"

  # ==================== TOKEN COMPLIANCE SERVICE ====================
  compliance-token:
    build:
      context: ../compliance-token
      dockerfile: Dockerfile
    container_name: thaliumx-compliance-token
    restart: unless-stopped
    # Remove external port exposure - accessed via reverse proxy
    expose:
      - "3004"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - SERVICE_NAME=token-compliance-service
      - PORT=3004
      - DB_HOST=thaliumx-postgres
      - DB_PORT=5432
      - DB_NAME=token_compliance
      - DB_USER=${DB_USER:-thaliumx}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DB_SSL=${DB_SSL:-false}
      - DATABASE_HOST=thaliumx-postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=token_compliance
      - DATABASE_USER=${DB_USER:-thaliumx}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DATABASE_SSL=${DB_SSL:-false}
      - REDIS_HOST=thaliumx-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_DB=3
      - KAFKA_BROKERS=thaliumx-kafka:9092
      - KAFKA_CLIENT_ID=token-compliance-service
      - KAFKA_GROUP_ID=token-compliance-group
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WALLET_SCREENING_ENABLED=${WALLET_SCREENING_ENABLED:-true}
      - API_KEY=${API_KEY:?API_KEY is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    networks:
      - thaliumx-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.compliance-token.rule=PathPrefix(`/api/compliance/token`)"
      - "traefik.http.services.compliance-token.loadbalancer.server.port=3004"

  # ==================== COMPLIANCE COORDINATOR SERVICE ====================
  compliance-coordinator:
    build:
      context: ../compliance-coordinator
      dockerfile: Dockerfile
    container_name: thaliumx-compliance-coordinator
    restart: unless-stopped
    # Remove external port exposure - accessed via reverse proxy
    expose:
      - "3005"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - SERVICE_NAME=compliance-coordinator-service
      - PORT=3005
      - DB_HOST=thaliumx-postgres
      - DB_PORT=5432
      - DB_NAME=compliance_coordinator
      - DB_USER=${DB_USER:-thaliumx}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DB_SSL=${DB_SSL:-false}
      - DATABASE_HOST=thaliumx-postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=compliance_coordinator
      - DATABASE_USER=${DB_USER:-thaliumx}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DATABASE_SSL=${DB_SSL:-false}
      - REDIS_HOST=thaliumx-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - REDIS_DB=4
      - KAFKA_BROKERS=thaliumx-kafka:9092
      - KAFKA_CLIENT_ID=compliance-coordinator-service
      - KAFKA_GROUP_ID=compliance-coordinator-group
      - CEX_COMPLIANCE_URL=http://thaliumx-compliance-cex:3001
      - DEX_COMPLIANCE_URL=http://thaliumx-compliance-dex:3002
      - NFT_COMPLIANCE_URL=http://thaliumx-compliance-nft:3003
      - TOKEN_COMPLIANCE_URL=http://thaliumx-compliance-token:3004
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AGGREGATION_ENABLED=${AGGREGATION_ENABLED:-true}
      - ALERTS_ENABLED=${ALERTS_ENABLED:-true}
      - REPORTING_ENABLED=${REPORTING_ENABLED:-true}
      - API_KEY=${API_KEY:?API_KEY is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    networks:
      - thaliumx-net
    volumes:
      - compliance-reports:/data/reports
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.compliance-coordinator.rule=PathPrefix(`/api/compliance`)"
      - "traefik.http.services.compliance-coordinator.loadbalancer.server.port=3005"

  # ==================== SUPPORTING SERVICES ====================

networks:
  thaliumx-net:
    external: true

volumes:
  postgres-data:
    name: thaliumx-compliance-postgres-data
  redis-data:
    name: thaliumx-compliance-redis-data
  kafka-data:
    name: thaliumx-compliance-kafka-data
  compliance-reports:
    name: thaliumx-compliance-reports
