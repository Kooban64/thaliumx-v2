      - THREAT_DETECTION_ENABLED=true
      - THREAT_DETECTION_SENSITIVITY=medium
      - BLOCKCHAIN_PROVIDERS='{"ethereum":"https://mainnet.infura.io/v3/YOUR_PROJECT_ID","polygon":"https://polygon-rpc.com"}'
      - API_KEY=c8f7ecfcfdc37ce3e566569839160ac1315f827d3675653c73048c2631a93440
      - ENCRYPTION_KEY=secure-encryption-key-for-production-2025-32-chars!
      - JWT_SECRET=secure-jwt-secret-for-production-environment-2025-32-chars!
    volumes:
