      - /home/ubuntu/thaliumx-v1/docker/certs/services/postgres/ca.crt:/etc/ssl/certs/postgres-ca.crt:ro
      - /home/ubuntu/thaliumx-v1/docker/certs/ca/ca.crt:/etc/ssl/certs/ca.crt:ro
      - /home/ubuntu/thaliumx-v1/docker/certs/client/compliance-service/compliance-service.crt:/etc/ssl/certs/client.crt:ro
      - /home/ubuntu/thaliumx-v1/docker/certs/client/compliance-service/compliance-service.key:/etc/ssl/private/client.key:ro
    networks:
      - thaliumx-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.thaliumx.service=compliance-dex"
      - "com.thaliumx.component=compliance"
      - "com.thaliumx.description=DEX Compliance Service"
      - "com.thaliumx.tier=application"

