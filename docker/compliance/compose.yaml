# ThaliumX Compliance Services Stack
# Docker Compose configuration for all compliance microservices

services:
  # ==================== CEX COMPLIANCE SERVICE ====================
  compliance-cex:
    build:
      context: /home/ubuntu/thaliumx-v1/docker/compliance-cex
      dockerfile: Dockerfile
    container_name: thaliumx-compliance-cex
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=cex-compliance-service
      - PORT=3001
      - DB_HOST=thaliumx-postgres
      - DB_PORT=5432
      - DB_NAME=cex_compliance
      - DB_USER=thaliumx
      - DATABASE_PASSWORD_FILE=/run/secrets/postgres-password
      - DATABASE_PASSWORD=dW2QSkQnxJhaY2pP8mAt7YR9qtmbaHZ7
      - DATABASE_PASSWORD_FILE=/run/secrets/postgres-password
      - DATABASE_PASSWORD=dW2QSkQnxJhaY2pP8mAt7YR9qtmbaHZ7
      - DB_SSL=true
      - DB_SSL_MODE=require
      - DB_SSL_CERT=/etc/ssl/certs/client.crt
      - DB_SSL_KEY=/etc/ssl/private/client.key
      - REDIS_HOST=thaliumx-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD_FILE=/run/secrets/redis-password
      - REDIS_DB=0
      - KAFKA_BROKERS=thaliumx-kafka:9092
      - KAFKA_CLIENT_ID=cex-compliance-service
      - KAFKA_GROUP_ID=cex-compliance-group
      - LOG_LEVEL=info
      - API_KEY_FILE=/run/secrets/api-key
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption-key
      - JWT_SECRET_FILE=/run/secrets/jwt-secret
      - VAULT_ADDR=https://vault:8200
      - VAULT_SKIP_VERIFY=true
      - KEYCLOAK_URL=https://keycloak:8443
      - KEYCLOAK_REALM=thaliumx
      - KEYCLOAK_CLIENT_ID=thaliumx-compliance-cex
      - KEYCLOAK_CLIENT_SECRET_FILE=/run/secrets/keycloak-compliance-cex-secret
      - METRICS_ENABLED=true
      - PROMETHEUS_METRICS_PORT=9092
      - AUDIT_LOG_ENABLED=true
      - AUDIT_LOG_LEVEL=info
      - THREAT_DETECTION_ENABLED=true
      - THREAT_DETECTION_SENSITIVITY=medium
      - API_KEY=c8f7ecfcfdc37ce3e566569839160ac1315f827d3675653c73048c2631a93440
      - ENCRYPTION_KEY=secure-encryption-key-for-production-2025-32-chars!
      - JWT_SECRET=secure-jwt-secret-for-production-environment-2025-32-chars!
    volumes:
      - /home/ubuntu/thaliumx-v1/.secrets:/run/secrets:ro
      - /home/ubuntu/thaliumx-v1/docker/certs/services/postgres/ca.crt:/etc/ssl/certs/postgres-ca.crt:ro
      - /home/ubuntu/thaliumx-v1/docker/certs/ca/ca.crt:/etc/ssl/certs/ca.crt:ro
      - /home/ubuntu/thaliumx-v1/docker/certs/client/compliance-service/compliance-service.crt:/etc/ssl/certs/client.crt:ro
      - /home/ubuntu/thaliumx-v1/docker/certs/client/compliance-service/compliance-service.key:/etc/ssl/private/client.key:ro
    networks:
      - thaliumx-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.thaliumx.service=compliance-cex"
      - "com.thaliumx.component=compliance"
      - "com.thaliumx.description=CEX Compliance Service"
      - "com.thaliumx.tier=application"

