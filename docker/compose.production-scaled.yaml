# ThaliumX Production Scaled Docker Compose
# =========================================
# Horizontal scaling configuration for 100k+ users
# Includes load balancing, multiple service instances, and read replicas
#
# Usage:
#   docker-compose -f compose.production-scaled.yaml up -d
#
# Scaling factors:
# - Backend: 4 instances
# - Frontend: 2 instances (with load balancer)
# - Database: 1 writer + 2 readers
# - Redis: 1 master + 2 replicas
# - Kafka: 3 brokers
# - APISIX: 2 instances

version: '3.8'

x-common-env: &common-env
  NODE_ENV: production
  TZ: UTC

x-vault-env: &vault-env
  VAULT_ADDR: http://vault:8200
  VAULT_SKIP_VERIFY: "false"

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "5"
    labels: "service,environment"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

x-restart-policy: &restart-policy
  restart: unless-stopped

networks:
  thaliumx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

  database-network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/16

  monitoring-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  postgres-data:
    driver: local
  postgres-replica-1-data:
    driver: local
  postgres-replica-2-data:
    driver: local
  redis-data:
    driver: local
  redis-replica-1-data:
    driver: local
  redis-replica-2-data:
    driver: local
  mongodb-data:
    driver: local
  vault-data:
    driver: local
  keycloak-data:
    driver: local
  kafka-1-data:
    driver: local
  kafka-2-data:
    driver: local
  kafka-3-data:
    driver: local
  zookeeper-1-data:
    driver: local
  zookeeper-2-data:
    driver: local
  zookeeper-3-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  etcd-data:
    driver: local
  apisix-1-logs:
    driver: local
  apisix-2-logs:
    driver: local

services:
  # ============================================
  # LOAD BALANCER
  # ============================================

  # HAProxy Load Balancer
  haproxy:
    image: haproxy:2.9-alpine
    container_name: thaliumx-haproxy
    <<: *restart-policy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs/ssl/fullchain.pem:/etc/ssl/certs/thaliumx.crt:ro
      - ./certs/ssl/privkey.pem:/etc/ssl/private/thaliumx.key:ro
    networks:
      - thaliumx-network
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================
  # DATABASE CLUSTER
  # ============================================

  # PostgreSQL Primary (Writer)
  postgres-primary:
    image: postgres:16-alpine
    container_name: thaliumx-postgres-primary
    <<: *restart-policy
    environment:
      POSTGRES_DB: thaliumx
      POSTGRES_USER: thaliumx
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./citus/init:/docker-entrypoint-initdb.d:ro
      - ./certs/services/postgres:/var/lib/postgresql/certs:ro
      - ./certs/ca/ca.crt:/var/lib/postgresql/ca.crt:ro
    secrets:
      - postgres-password
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/certs/server.crt
      -c ssl_key_file=/var/lib/postgresql/certs/server.key
      -c ssl_ca_file=/var/lib/postgresql/ca.crt
      -c max_connections=1000
      -c shared_buffers=4GB
      -c effective_cache_size=12GB
      -c maintenance_work_mem=1GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=64MB
      -c default_statistics_target=1000
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=16MB
      -c min_wal_size=4GB
      -c max_wal_size=16GB
      -c max_worker_processes=16
      -c max_parallel_workers_per_gather=8
      -c max_parallel_workers=16
      -c max_parallel_maintenance_workers=8
      -c log_statement=all
      -c log_connections=on
      -c log_disconnections=on
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
      -c log_lock_waits=on
      -c log_temp_files=0
      -c track_io_timing=on
      -c track_functions=pl
      -c autovacuum=on
      -c autovacuum_max_workers=12
      -c autovacuum_naptime=20s
      -c autovacuum_vacuum_threshold=50
      -c autovacuum_analyze_threshold=50
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
    networks:
      - thaliumx-network
      - database-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thaliumx -d thaliumx"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G

  # PostgreSQL Read Replica 1
  postgres-replica-1:
    image: postgres:16-alpine
    container_name: thaliumx-postgres-replica-1
    <<: *restart-policy
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRES_DB: thaliumx
      POSTGRES_USER: thaliumx
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      PGUSER: thaliumx
      PGPASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres-replica-1-data:/var/lib/postgresql/data
      - ./certs/services/postgres:/var/lib/postgresql/certs:ro
      - ./certs/ca/ca.crt:/var/lib/postgresql/ca.crt:ro
    secrets:
      - postgres-password
    command: >
      bash -c "
      until pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U thaliumx -vP -W; do
        echo 'Waiting for primary to be ready...'
        sleep 5
      done
      echo 'primary_conninfo = '\''host=postgres-primary port=5432 user=thaliumx password_file=/run/secrets/postgres-password sslmode=require sslcert=/var/lib/postgresql/certs/server.crt sslkey=/var/lib/postgresql/certs/server.key sslrootcert=/var/lib/postgresql/ca.crt'''' >> /var/lib/postgresql/data/postgresql.conf
      exec postgres -c config_file=/var/lib/postgresql/data/postgresql.conf
      "
    networks:
      - thaliumx-network
      - database-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thaliumx -d thaliumx -h localhost"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # PostgreSQL Read Replica 2
  postgres-replica-2:
    image: postgres:16-alpine
    container_name: thaliumx-postgres-replica-2
    <<: *restart-policy
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRES_DB: thaliumx
      POSTGRES_USER: thaliumx
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      PGUSER: thaliumx
      PGPASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres-replica-2-data:/var/lib/postgresql/data
      - ./certs/services/postgres:/var/lib/postgresql/certs:ro
      - ./certs/ca/ca.crt:/var/lib/postgresql/ca.crt:ro
    secrets:
      - postgres-password
    command: >
      bash -c "
      until pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U thaliumx -vP -W; do
        echo 'Waiting for primary to be ready...'
        sleep 5
      done
      echo 'primary_conninfo = '\''host=postgres-primary port=5432 user=thaliumx password_file=/run/secrets/postgres-password sslmode=require sslcert=/var/lib/postgresql/certs/server.crt sslkey=/var/lib/postgresql/certs/server.key sslrootcert=/var/lib/postgresql/ca.crt'''' >> /var/lib/postgresql/data/postgresql.conf
      exec postgres -c config_file=/var/lib/postgresql/data/postgresql.conf
      "
    networks:
      - thaliumx-network
      - database-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thaliumx -d thaliumx -h localhost"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # ============================================
  # REDIS CLUSTER
  # ============================================

  # Redis Master
  redis-master:
    image: redis:7-alpine
    container_name: thaliumx-redis-master
    <<: *restart-policy
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis-password
    command: >
      redis-server
      --requirepassfile /run/secrets/redis-password
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --timeout 0
      --tls-port 6379
      --port 0
      --tls-cert-file /certs/server.crt
      --tls-key-file /certs/server.key
      --tls-ca-cert-file /certs/ca.crt
      --tls-auth-clients optional
      --maxclients 10000
      --tcp-backlog 511
      --databases 16
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
      - ./certs/services/redis:/certs:ro
      - ./certs/ca/ca.crt:/certs/ca.crt:ro
    secrets:
      - redis-password
    networks:
      - thaliumx-network
      - database-network
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cert", "/certs/server.crt", "--key", "/certs/server.key", "--cacert", "/certs/ca.crt", "ping"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Redis Replica 1
  redis-replica-1:
    image: redis:7-alpine
    container_name: thaliumx-redis-replica-1
    <<: *restart-policy
    depends_on:
      redis-master:
        condition: service_healthy
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis-password
    command: >
      redis-server
      --requirepassfile /run/secrets/redis-password
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --timeout 0
      --tls-port 6379
      --port 0
      --tls-cert-file /certs/server.crt
      --tls-key-file /certs/server.key
      --tls-ca-cert-file /certs/ca.crt
      --tls-auth-clients optional
      --maxclients 10000
      --replicaof redis-master 6379
    volumes:
      - redis-replica-1-data:/data
      - ./certs/services/redis:/certs:ro
      - ./certs/ca/ca.crt:/certs/ca.crt:ro
    secrets:
      - redis-password
    networks:
      - thaliumx-network
      - database-network
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cert", "/certs/server.crt", "--key", "/certs/server.key", "--cacert", "/certs/ca.crt", "-h", "redis-master", "ping"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================
  # KAFKA CLUSTER
  # ============================================

  # Zookeeper 1
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: thaliumx-zookeeper-1
    <<: *restart-policy
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_MAX_CLIENT_CNXNS: 1000
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 1
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
      ZOOKEEPER_SERVER_1: zookeeper-1:2888:3888
      ZOOKEEPER_SERVER_2: zookeeper-2:2888:3888
      ZOOKEEPER_SERVER_3: zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms1g"
    volumes:
      - zookeeper-1-data:/var/lib/zookeeper/data
      - zookeeper-1-data:/var/lib/zookeeper/log
    networks:
      - thaliumx-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 1G

  # Zookeeper 2
  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: thaliumx-zookeeper-2
    <<: *restart-policy
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_MAX_CLIENT_CNXNS: 1000
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 1
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
      ZOOKEEPER_SERVER_1: zookeeper-1:2888:3888
      ZOOKEEPER_SERVER_2: zookeeper-2:2888:3888
      ZOOKEEPER_SERVER_3: zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms1g"
    volumes:
      - zookeeper-2-data:/var/lib/zookeeper/data
      - zookeeper-2-data:/var/lib/zookeeper/log
    networks:
      - thaliumx-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 1G

  # Zookeeper 3
  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: thaliumx-zookeeper-3
    <<: *restart-policy
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_MAX_CLIENT_CNXNS: 1000
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 1
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
      ZOOKEEPER_SERVER_1: zookeeper-1:2888:3888
      ZOOKEEPER_SERVER_2: zookeeper-2:2888:3888
      ZOOKEEPER_SERVER_3: zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms1g"
    volumes:
      - zookeeper-3-data:/var/lib/zookeeper/data
      - zookeeper-3-data:/var/lib/zookeeper/log
    networks:
      - thaliumx-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 1G

  # Kafka Broker 1
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: thaliumx-kafka-1
    <<: *restart-policy
    depends_on:
      zookeeper-1:
        condition: service_healthy
      zookeeper-2:
        condition: service_healthy
      zookeeper-3:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 24
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_RECOVERY_THREADS_PER_DATA_DIR: 4
      KAFKA_NUM_IO_THREADS: 16
      KAFKA_NUM_NETWORK_THREADS: 6
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_AUTO_LEADER_REBALANCE_ENABLE: "true"
      KAFKA_LEADER_IMBALANCE_CHECK_INTERVAL_SECONDS: 300
      KAFKA_LEADER_IMBALANCE_PER_BROKER_PERCENTAGE: 10
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_MESSAGE_MAX_BYTES: 1000012
      KAFKA_REPLICA_FETCH_MAX_BYTES: 1048576
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx4g -Xms4g"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks:
      - thaliumx-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # Kafka Broker 2
  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: thaliumx-kafka-2
    <<: *restart-policy
    depends_on:
      zookeeper-1:
        condition: service_healthy
      zookeeper-2:
        condition: service_healthy
      zookeeper-3:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 24
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_RECOVERY_THREADS_PER_DATA_DIR: 4
      KAFKA_NUM_IO_THREADS: 16
      KAFKA_NUM_NETWORK_THREADS: 6
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_AUTO_LEADER_REBALANCE_ENABLE: "true"
      KAFKA_LEADER_IMBALANCE_CHECK_INTERVAL_SECONDS: 300
      KAFKA_LEADER_IMBALANCE_PER_BROKER_PERCENTAGE: 10
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_MESSAGE_MAX_BYTES: 1000012
      KAFKA_REPLICA_FETCH_MAX_BYTES: 1048576
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx4g -Xms4g"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    networks:
      - thaliumx-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # Kafka Broker 3
  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: thaliumx-kafka-3
    <<: *restart-policy
    depends_on:
      zookeeper-1:
        condition: service_healthy
      zookeeper-2:
        condition: service_healthy
      zookeeper-3:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 24
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_RECOVERY_THREADS_PER_DATA_DIR: 4
      KAFKA_NUM_IO_THREADS: 16
      KAFKA_NUM_NETWORK_THREADS: 6
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_AUTO_LEADER_REBALANCE_ENABLE: "true"
      KAFKA_LEADER_IMBALANCE_CHECK_INTERVAL_SECONDS: 300
      KAFKA_LEADER_IMBALANCE_PER_BROKER_PERCENTAGE: 10
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_MESSAGE_MAX_BYTES: 1000012
      KAFKA_REPLICA_FETCH_MAX_BYTES: 1048576
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx4g -Xms4g"
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    networks:
      - thaliumx-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

