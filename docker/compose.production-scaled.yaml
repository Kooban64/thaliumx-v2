        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      <<: [*common-env, *vault-env]
      PORT: 3002
      DB_HOST: postgres-primary,postgres-replica-1,postgres-replica-2
      DB_PORT: 5432
      DB_NAME: thaliumx
      DB_USER: thaliumx
      DB_SSL: "true"
      DB_POOL_SIZE: 25
      DB_POOL_MAX_IDLE_TIME: 30000
      DB_POOL_MAX_LIFETIME: 600000
      REDIS_HOST: redis-master,redis-replica-1
      REDIS_PORT: 6379
      REDIS_TLS: "true"
      REDIS_MAX_CONNECTIONS: 25
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_POOL_SIZE: 10
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: thaliumx
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: thaliumx-backend
      NODE_OPTIONS: "--max-old-space-size=4096"
      INSTANCE_ID: backend-1
    volumes:
      - ./certs/client/backend-service:/app/certs:ro
      - ./certs/ca/ca.crt:/app/certs/ca.crt:ro
    secrets:
      - vault-role-id
      - vault-secret-id
      - postgres-password
      - redis-password
      - jwt-secret
      - encryption-key
    networks:
      - thaliumx-network
    healthcheck:
