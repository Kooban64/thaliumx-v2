# ThaliumX Production Docker Compose
# Complete production deployment with all services
# 
# Usage:
#   docker-compose -f compose.production.yaml up -d
#
# Prerequisites:
#   - All secrets generated in .secrets/generated/
#   - TLS certificates in docker/certs/
#   - Vault initialized and unsealed
#   - .env.production configured

version: '3.8'

x-common-env: &common-env
  NODE_ENV: production
  TZ: UTC

x-vault-env: &vault-env
  VAULT_ADDR: http://vault:8200
  VAULT_SKIP_VERIFY: "false"

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"
    labels: "service,environment"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

x-restart-policy: &restart-policy
  restart: unless-stopped

networks:
  thaliumx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  
  # Isolated network for databases
  database-network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/16

  # Isolated network for monitoring
  monitoring-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  mongodb-data:
    driver: local
  vault-data:
    driver: local
  keycloak-data:
    driver: local
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  etcd-data:
    driver: local
  apisix-logs:
    driver: local

services:
  # ============================================
  # CORE INFRASTRUCTURE
  # ============================================

  # HashiCorp Vault - Secrets Management
  vault:
    image: hashicorp/vault:1.15
    container_name: thaliumx-vault
    <<: *restart-policy
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_API_ADDR: http://vault:8200
      VAULT_CLUSTER_ADDR: https://vault:8201
    volumes:
      - vault-data:/vault/data
      - ./vault/config:/vault/config:ro
      - ./certs/services/vault:/vault/certs:ro
    command: server -config=/vault/config/vault-production.hcl
    ports:
      - "8200:8200"
    networks:
      - thaliumx-network
    healthcheck:
      test: ["CMD", "vault", "status"]
      <<: *healthcheck-defaults
    logging: *logging

  # PostgreSQL - Primary Database
  postgres:
    image: postgres:16-alpine
    container_name: thaliumx-postgres
    <<: *restart-policy
    environment:
      POSTGRES_DB: thaliumx
      POSTGRES_USER: thaliumx
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./citus/init:/docker-entrypoint-initdb.d:ro
      - ./certs/services/postgres:/var/lib/postgresql/certs:ro
      - ./certs/ca/ca.crt:/var/lib/postgresql/ca.crt:ro
    secrets:
      - postgres-password
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/certs/server.crt
      -c ssl_key_file=/var/lib/postgresql/certs/server.key
      -c ssl_ca_file=/var/lib/postgresql/ca.crt
      -c max_connections=1000
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c maintenance_work_mem=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=32MB
      -c default_statistics_target=500
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=8MB
      -c min_wal_size=2GB
      -c max_wal_size=8GB
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4
      -c log_statement=all
      -c log_connections=on
      -c log_disconnections=on
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
      -c log_lock_waits=on
      -c log_temp_files=0
      -c track_io_timing=on
      -c track_functions=pl
      -c autovacuum=on
      -c autovacuum_max_workers=6
      -c autovacuum_naptime=20s
      -c autovacuum_vacuum_threshold=50
      -c autovacuum_analyze_threshold=50
    ports:
      - "5432:5432"
    networks:
      - thaliumx-network
      - database-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thaliumx -d thaliumx"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # Redis - Caching and Sessions
  redis:
    image: redis:7-alpine
    container_name: thaliumx-redis
    <<: *restart-policy
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis-password
    command: >
      redis-server
      --requirepassfile /run/secrets/redis-password
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --timeout 0
      --tls-port 6379
      --port 0
      --tls-cert-file /certs/server.crt
      --tls-key-file /certs/server.key
      --tls-ca-cert-file /certs/ca.crt
      --tls-auth-clients optional
      --maxclients 10000
      --tcp-backlog 511
      --databases 16
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
      - ./certs/services/redis:/certs:ro
      - ./certs/ca/ca.crt:/certs/ca.crt:ro
    ports:
      - "6379:6379"
    networks:
      - thaliumx-network
      - database-network
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cert", "/certs/server.crt", "--key", "/certs/server.key", "--cacert", "/certs/ca.crt", "ping"]
      <<: *healthcheck-defaults
    logging: *logging

  # MongoDB - Document Store
  mongodb:
    image: mongo:7
    container_name: thaliumx-mongodb
    <<: *restart-policy
    environment:
      MONGO_INITDB_ROOT_USERNAME: thaliumx
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongodb-password
      MONGO_INITDB_DATABASE: thaliumx
    volumes:
      - mongodb-data:/data/db
      - ./certs/services/mongodb:/certs:ro
      - ./certs/ca/ca.crt:/certs/ca.crt:ro
    secrets:
      - mongodb-password
    command: >
      mongod
      --tlsMode requireTLS
      --tlsCertificateKeyFile /certs/mongodb.pem
      --tlsCAFile /certs/ca.crt
      --auth
      --bind_ip_all
      --dbpath /data/db
      --logpath /data/db/mongod.log
      --fork
      --replSet rs0
      --keyFile /certs/mongodb-keyfile
      --clusterAuthMode x509
      --maxConns 1000
      --wiredTigerMaxCacheOverflowSizeGB 1
      --wiredTigerCacheSizeGB 2
      --setParameter ttlMonitorSleepSecs=60
      --setParameter wiredTigerMaxCacheOverflowSizeGB=1
    ports:
      - "27017:27017"
    networks:
      - thaliumx-network
      - database-network
    healthcheck:
      test: ["CMD", "mongosh", "--tls", "--tlsCAFile", "/certs/ca.crt", "--eval", "db.adminCommand('ping')"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ============================================
  # MESSAGE QUEUE
  # ============================================

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: thaliumx-zookeeper
    <<: *restart-policy
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_MAX_CLIENT_CNXNS: 1000
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 1
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-data:/var/lib/zookeeper/log
    networks:
      - thaliumx-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Kafka - Event Streaming
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: thaliumx-kafka
    <<: *restart-policy
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_RECOVERY_THREADS_PER_DATA_DIR: 2
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_NUM_NETWORK_THREADS: 3
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_AUTO_LEADER_REBALANCE_ENABLE: "true"
      KAFKA_LEADER_IMBALANCE_CHECK_INTERVAL_SECONDS: 300
      KAFKA_LEADER_IMBALANCE_PER_BROKER_PERCENTAGE: 10
      KAFKA_COMPRESSION_TYPE: producer
      KAFKA_MESSAGE_MAX_BYTES: 1000012
      KAFKA_REPLICA_FETCH_MAX_BYTES: 1048576
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx2g -Xms2g"
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - thaliumx-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ============================================
  # AUTHENTICATION
  # ============================================

  # Keycloak - Identity and Access Management
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: thaliumx-keycloak
    <<: *restart-policy
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: thaliumx
      KC_DB_PASSWORD_FILE: /run/secrets/postgres-password
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/server.key
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_CACHE_STACK: kubernetes
      KC_SPI_CONNECTIONS_HTTP_CLIENT_DEFAULT_CONNECT_TIMEOUT: 10000
      KC_SPI_CONNECTIONS_HTTP_CLIENT_DEFAULT_READ_TIMEOUT: 30000
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/keycloak-admin-password
      JAVA_OPTS: "-Xms1024m -Xmx2048m -XX:MetaspaceSize=128m -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv4Stack=true"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-config:/opt/keycloak/data/import:ro
      - ./certs/services/keycloak:/opt/keycloak/certs:ro
    secrets:
      - postgres-password
      - keycloak-admin-password
    command: start --import-realm --optimized
    ports:
      - "8080:8080"
      - "8443:8443"
    networks:
      - thaliumx-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 1.5G

  # ============================================
  # API GATEWAY
  # ============================================

  # etcd for APISIX
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: thaliumx-etcd
    <<: *restart-policy
    environment:
      ETCD_ADVERTISE_CLIENT_URLS: https://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: https://0.0.0.0:2379
      ETCD_CERT_FILE: /etc/ssl/etcd/server.crt
      ETCD_KEY_FILE: /etc/ssl/etcd/server.key
      ETCD_TRUSTED_CA_FILE: /etc/ssl/etcd/ca.crt
      ETCD_CLIENT_CERT_AUTH: "true"
      ETCD_AUTO_TLS: "false"
      ETCD_DATA_DIR: /etcd-data
      ETCD_SNAPSHOT_COUNT: 50000
      ETCD_HEARTBEAT_INTERVAL: 100
      ETCD_ELECTION_TIMEOUT: 1000
      ETCD_MAX_REQUEST_BYTES: 33554432
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
    volumes:
      - etcd-data:/etcd-data
      - ./certs/services/etcd:/etc/ssl/etcd:ro
      - ./certs/ca/ca.crt:/etc/ssl/etcd/ca.crt:ro
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - thaliumx-network
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=https://localhost:2379", "--cacert=/etc/ssl/etcd/ca.crt", "--cert=/etc/ssl/etcd/server.crt", "--key=/etc/ssl/etcd/server.key", "endpoint", "health"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # APISIX - API Gateway
  apisix:
    image: apache/apisix:3.7.0-debian
    container_name: thaliumx-apisix
    <<: *restart-policy
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./apisix/config/apisix-production.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./certs/services/apisix:/usr/local/apisix/certs:ro
      - ./certs/ca/ca.crt:/usr/local/apisix/certs/ca.crt:ro
      - apisix-logs:/usr/local/apisix/logs
    ports:
      - "9080:9080"   # HTTP
      - "9443:9443"   # HTTPS
      - "9180:9180"   # Admin API
      - "9091:9091"   # Prometheus metrics
    networks:
      - thaliumx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/apisix/status"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================
  # APPLICATION SERVICES
  # ============================================

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: thaliumx/backend:${VERSION:-latest}
    container_name: thaliumx-backend
    <<: *restart-policy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: [*common-env, *vault-env]
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: thaliumx
      DB_USER: thaliumx
      DB_SSL: "true"
      DB_POOL_SIZE: 20
      DB_POOL_MAX_IDLE_TIME: 30000
      DB_POOL_MAX_LIFETIME: 600000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "true"
      REDIS_MAX_CONNECTIONS: 50
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_POOL_SIZE: 10
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: thaliumx
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: thaliumx-backend
      NODE_OPTIONS: "--max-old-space-size=2048"
    volumes:
      - ./certs/client/backend-service:/app/certs:ro
      - ./certs/ca/ca.crt:/app/certs/ca.crt:ro
    secrets:
      - vault-role-id
      - vault-secret-id
      - postgres-password
      - redis-password
      - jwt-secret
      - encryption-key
    ports:
      - "3002:3002"
    networks:
      - thaliumx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: ${API_URL:-https://api.thaliumx.com}
        NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_URL:-https://auth.thaliumx.com}
    image: thaliumx/frontend:${VERSION:-latest}
    container_name: thaliumx-frontend
    <<: *restart-policy
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *common-env
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${API_URL:-http://backend:3002}
      NODE_OPTIONS: "--max-old-space-size=1024"
    ports:
      - "3000:3000"
    networks:
      - thaliumx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # QuantLib Service (Python)
  quantlib-svc:
    build:
      context: ./backend/services/quantlib-svc
      dockerfile: Dockerfile
    image: thaliumx/quantlib-svc:${VERSION:-latest}
    container_name: thaliumx-quantlib
    <<: *restart-policy
    environment:
      <<: *common-env
      PORT: 8000
      REDIS_URL: redis://redis:6379
      WORKERS: 4
      THREADS: 2
      MAX_REQUESTS: 1000
      MAX_REQUESTS_JITTER: 50
    ports:
      - "8000:8000"
    networks:
      - thaliumx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================
  # OBSERVABILITY
  # ============================================

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: thaliumx-otel-collector
    <<: *restart-policy
    command: ["--config=/etc/otel-collector-config.yaml", "--log-level=warn"]
    volumes:
      - ./observability/config/otel-collector.yml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics
      - "8889:8889"   # Prometheus exporter
    networks:
      - thaliumx-network
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Prometheus - Metrics
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: thaliumx-prometheus
    <<: *restart-policy
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.max-connections=512'
      - '--storage.tsdb.wal-compression'
      - '--query.max-concurrency=20'
      - '--query.timeout=2m'
    volumes:
      - ./observability/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/config/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - thaliumx-network
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Grafana - Dashboards
  grafana:
    image: grafana/grafana:10.2.2
    container_name: thaliumx-grafana
    <<: *restart-policy
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3001}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_SERVER_HTTP_PORT: 3000
      GF_LOG_LEVEL: warn
      GF_METRICS_ENABLED: "true"
      GF_ALERTING_ENABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_RENDERING_SERVER_URL: ""
      GF_RENDERING_CALLBACK_URL: ""
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - grafana-admin-password
    ports:
      - "3001:3000"
    networks:
      - thaliumx-network
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:2.9.2
    container_name: thaliumx-loki
    <<: *restart-policy
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/config/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - thaliumx-network
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Promtail - Log Shipper
  promtail:
    image: grafana/promtail:2.9.2
    container_name: thaliumx-promtail
    <<: *restart-policy
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./observability/config/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - thaliumx-network
      - monitoring-network
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M

  # Alertmanager - Alert Routing
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: thaliumx-alertmanager
    <<: *restart-policy
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--data.retention=120h'
      - '--cluster.listen-address='
    volumes:
      - ./observability/config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - thaliumx-network
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: thaliumx-jaeger
    <<: *restart-policy
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
      MEMORY_MAX_TRACES: 50000
      BADGER_SPAN_STORE_TTL: 72h
    volumes:
      - ./observability/jaeger-data:/badger
    ports:
      - "16686:16686"  # UI
      - "14250:14250"  # gRPC
    networks:
      - thaliumx-network
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      <<: *healthcheck-defaults
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

# ============================================
# SECRETS
# ============================================

secrets:
  postgres-password:
    file: .secrets/generated/postgres-password
  redis-password:
    file: .secrets/generated/redis-password
  mongodb-password:
    file: .secrets/generated/mongodb-password
  jwt-secret:
    file: .secrets/generated/jwt-secret
  encryption-key:
    file: .secrets/generated/encryption-key
  keycloak-admin-password:
    file: .secrets/generated/keycloak-admin-password
  vault-role-id:
    file: .secrets/generated/vault-role-id
  vault-secret-id:
    file: .secrets/generated/vault-secret-id
  grafana-admin-password:
    file: .secrets/generated/grafana-admin-password