services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd=http://etcd:2380
    ports:
      - "2379:2379"
    networks:
      - ci-net

  apisix:
    image: apache/apisix:3.11.0-debian
    # CI only: run as root so APISIX can read the generated private key and bind TLS listener.
    user: "0:0"
    environment:
      APISIX_STAND_ALONE: "false"
    volumes:
      - ../../apisix/config/apisix-etcd.ci.yaml:/usr/local/apisix/conf/config.yaml:ro
      # TLS material generated by CI into ./docker/compose/ci/certs
      - ./certs/server.crt:/tmp/certs/server.crt:ro
      - ./certs/server.key:/tmp/certs/server.key:ro
    depends_on:
      - etcd
    ports:
      - "9080:9080"
      - "8443:9443"
    networks:
      - ci-net

  mock-backend:
    build:
      context: ../../smoke/mock-backend
    environment:
      PORT: 3000
    networks:
      - ci-net

  apisix-init:
    image: alpine:3.20
    depends_on:
      - apisix
      - mock-backend
    volumes:
      - ../../gateway/scripts/init-apisix-routes.sh:/scripts/init-apisix-routes.sh:ro
      # Provide TLS material so init can create an APISIX SSL object (matches SNI=localhost)
      - ./certs:/certs/apisix:ro
    entrypoint: ["sh", "-lc"]
    command:
      - |
        apk add --no-cache bash curl ca-certificates >/dev/null;
        export APISIX_ADMIN_URL="http://apisix:9180/apisix/admin";
        export APISIX_ADMIN_KEY="ci-admin-key";
        export FRONTEND_UPSTREAM="mock-backend:3000";
        export BACKEND_UPSTREAM="mock-backend:3000";
        export KEYCLOAK_UPSTREAM="mock-backend:3000";
        bash /scripts/init-apisix-routes.sh
    networks:
      - ci-net

networks:
  ci-net:
    driver: bridge
