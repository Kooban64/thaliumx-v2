# ThaliumX Production v1 - Base Configuration
# ============================================
# Shared networks, volumes, and secrets for all services
# Updated: 2025-12-17T08:58:00.000Z

version: '3.8'

networks:
  thaliumx-net:
    external: true
    name: thaliumx-net

  database-network:
    external: true
    name: docker_database-network

  monitoring-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  # Infrastructure
  vault-data:
    driver: local
  vault-audit-logs:
    driver: local

  # Databases
  postgres-data:
    driver: local
  citus_coordinator_data:
    driver: local
  citus_worker1_data:
    driver: local
  citus_worker2_data:
    driver: local
  timescaledb_data:
    driver: local
  mongodb-data:
    driver: local

  # Caching & Messaging
  redis-data:
    driver: local
  kafka-data:
    driver: local
  # Messaging (prod-v1 uses underscore volume key)
  kafka_data:
    name: thaliumx-kafka-data
  zookeeper-data:
    driver: local

  # API Gateway
  etcd_data:
    name: thaliumx-etcd-data
    driver: local
  apisix_logs:
    name: thaliumx-apisix-logs
    driver: local

  # Applications
  backend_logs:
    driver: local

  # Trading
  dingir_data:
    name: thaliumx-dingir-data
  dingir_logs:
    name: thaliumx-dingir-logs
  liquibook_data:
    name: thaliumx-liquibook-data
  liquibook_logs:
    name: thaliumx-liquibook-logs
  quantlib_data:
    name: thaliumx-quantlib-data
  quantlib_cache:
    name: thaliumx-quantlib-cache
  quantlib_models:
    name: thaliumx-quantlib-models

  # Search
  typesense_data:
    name: thaliumx-typesense-data

  # Security
  opa_data:
    driver: local

  # Monitoring
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

  # Monitoring (prod-v1 services use underscore volume keys)
  prometheus_data:
    name: thaliumx-prometheus-data
  grafana_data:
    name: thaliumx-grafana-data
  loki_data:
    name: thaliumx-loki-data
  tempo_data:
    name: thaliumx-tempo-data
  alertmanager_data:
    name: thaliumx-alertmanager-data

secrets:
  # Database credentials
  postgres-password:
    file: ../../../.secrets/generated/postgres-password
  mongodb-password:
    file: ../../../.secrets/generated/mongodb-password

  # Caching
  redis-password:
    file: ../../../.secrets/generated/redis-password
  # Redis exporter expects a JSON map (see `oliver006/redis_exporter` v1.58+).
  redis-exporter-passwords:
    file: ../../../.secrets/generated/redis-exporter-passwords.json

  # Security
  jwt-secret:
    file: ../../../.secrets/generated/jwt-secret
  encryption-key:
    file: ../../../.secrets/generated/encryption-key

  # Authentication
  postgres-username:
    file: ../../../.secrets/generated/postgres-username
  Authentik-admin-password:
    file: ../../../.secrets/generated/Authentik-admin-password

  # Vault
  vault-role-id:
    file: ../../../.secrets/generated/vault-role-id
  vault-secret-id:
    file: ../../../.secrets/generated/vault-secret-id

  # Monitoring
  grafana-admin-password:
    file: ../../../.secrets/generated/grafana-admin-password
  grafana-admin-username:
    file: ../../../.secrets/generated/grafana-admin-username

  # Messaging
  kafka-password:
    file: ../../../.secrets/generated/kafka-password
  kafka-ui-password:
    file: ../../../.secrets/generated/kafka-ui-password

  # Search
  typesense-api-key:
    file: ../../../.secrets/generated/typesense-api-key

  # Backend
  bybit-api-key:
    file: ../../../.secrets/generated/bybit-api-key
  bybit-api-secret:
    file: ../../../.secrets/generated/bybit-api-secret
  kucoin-api-key:
    file: ../../../.secrets/generated/kucoin-api-key
  kucoin-api-secret:
    file: ../../../.secrets/generated/kucoin-api-secret
  okx-api-key:
    file: ../../../.secrets/generated/okx-api-key
  okx-api-secret:
    file: ../../../.secrets/generated/okx-api-secret
  kraken-api-key:
    file: ../../../.secrets/generated/kraken-api-key
  kraken-api-secret:
    file: ../../../.secrets/generated/kraken-api-secret
  valr-api-key:
    file: ../../../.secrets/generated/valr-api-key
  valr-api-secret:
    file: ../../../.secrets/generated/valr-api-secret
  bitstamp-api-key:
    file: ../../../.secrets/generated/bitstamp-api-key
  bitstamp-api-secret:
    file: ../../../.secrets/generated/bitstamp-api-secret
  crypto-com-api-key:
    file: ../../../.secrets/generated/crypto-com-api-key
  crypto-com-api-secret:
    file: ../../../.secrets/generated/crypto-com-api-secret
  nedbank-api-key:
    file: ../../../.secrets/generated/nedbank-api-key
  nedbank-api-secret:
    file: ../../../.secrets/generated/nedbank-api-secret

  # API Keys and Service Secrets
  api-key:
    file: ../../../.secrets/generated/api-key

  # APISIX gateway OIDC plugin requires a `client_secret` value even in bearer_only mode.
  # In Authentik deployments we use this as a non-empty secret string to satisfy the schema.
  apisix-oidc-client-secret:
    file: ../../../.secrets/generated/apisix-oidc-client-secret

  # SMTP (backend email) - required for production config validation
  smtp-user:
    file: ../../../.secrets/generated/smtp-user
  smtp-password:
    file: ../../../.secrets/generated/smtp-password

  # Fintech Services
  ballerine-db-username:
    file: ../../../.secrets/generated/ballerine-db-username
  ballerine-db-password:
    file: ../../../.secrets/generated/ballerine-db-password
  ballerine-bcrypt-salt:
    file: ../../../.secrets/generated/ballerine-bcrypt-salt

  # Wazuh SIEM
  wazuh-indexer-username:
    file: ../../../.secrets/generated/wazuh-indexer-username
  wazuh-indexer-password:
    file: ../../../.secrets/generated/wazuh-indexer-password
  wazuh-dashboard-username:
    file: ../../../.secrets/generated/wazuh-dashboard-username
  wazuh-dashboard-password:
    file: ../../../.secrets/generated/wazuh-dashboard-password

  # Fintech Services (Ballerine)
  ballerine-db-url:
    file: ../../../.secrets/generated/ballerine-db-url
  ballerine-database-url:
    file: ../../../.secrets/generated/ballerine-database-url
  ballerine-redis-url:
    file: ../../../.secrets/generated/ballerine-redis-url
  ballerine-jwt-secret-key:
    file: ../../../.secrets/generated/ballerine-jwt-secret-key
  ballerine-session-secret:
    file: ../../../.secrets/generated/ballerine-session-secret
  ballerine-api-key:
    file: ../../../.secrets/generated/ballerine-api-key
  ballerine-hashing-key-secret-base64:
    file: ../../../.secrets/generated/ballerine-hashing-key-secret-base64
  ballerine-webhook-secret:
    file: ../../../.secrets/generated/ballerine-webhook-secret
  ballerine-encryption-key:
    file: ../../../.secrets/generated/ballerine-encryption-key
  ballerine-workflow-token:
    file: ../../../.secrets/generated/ballerine-workflow-token
  ballerine-collection-flow-token:
    file: ../../../.secrets/generated/ballerine-collection-flow-token
  ballerine-magic-link-jwt-secret:
    file: ../../../.secrets/generated/ballerine-magic-link-jwt-secret
  ballerine-magic-link-auth-jwt-secret:
    file: ../../../.secrets/generated/ballerine-magic-link-auth-jwt-secret

  # Legacy IdP-specific secrets removed; Authentik is the only supported identity provider.

  # Support Services
  support-db-password:
    file: ../../../.secrets/generated/support-db-password
