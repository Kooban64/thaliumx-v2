# ThaliumX Production v1 - Base Configuration
# ============================================
# Shared networks, volumes, and secrets for all services
# Updated: 2025-12-17T08:58:00.000Z

version: '3.8'

networks:
  thaliumx-net:
    external: true
    name: thaliumx-net

  database-network:
    external: true
    name: docker_database-network

  monitoring-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  # Infrastructure
  vault-data:
    driver: local
  vault-audit-logs:
    driver: local

  # Databases
  postgres-data:
    driver: local
  citus_coordinator_data:
    driver: local
  citus_worker1_data:
    driver: local
  citus_worker2_data:
    driver: local
  timescaledb_data:
    driver: local
  mongodb-data:
    driver: local

  # Caching & Messaging
  redis-data:
    driver: local
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local

  # API Gateway
  etcd-data:
    driver: local
  apisix-logs:
    driver: local

  # Authentication
  keycloak_data:
    driver: local

  # Applications
  backend_logs:
    driver: local

  # Security
  opa_data:
    driver: local

  # Monitoring
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

secrets:
  # Database credentials
  postgres-password:
    file: ../../../.secrets/generated/postgres-password
  mongodb-password:
    file: ../../../.secrets/generated/mongodb-password

  # Caching
  redis-password:
    file: ../../../.secrets/generated/redis-password
  # Redis exporter expects a JSON map (see `oliver006/redis_exporter` v1.58+).
  redis-exporter-passwords:
    file: ../../../.secrets/generated/redis-exporter-passwords.json

  # Security
  jwt-secret:
    file: ../../../.secrets/generated/jwt-secret
  encryption-key:
    file: ../../../.secrets/generated/encryption-key

  # Authentication
  keycloak-admin-username:
    file: ../../../.secrets/generated/keycloak-admin-username
  keycloak-admin-password:
    file: ../../../.secrets/generated/keycloak-admin-password
  postgres-username:
    file: ../../../.secrets/generated/postgres-username

  # Vault
  vault-role-id:
    file: ../../../.secrets/generated/vault-role-id
  vault-secret-id:
    file: ../../../.secrets/generated/vault-secret-id

  # Monitoring
  grafana-admin-password:
    file: ../../../.secrets/generated/grafana-admin-password
  grafana-admin-username:
    file: ../../../.secrets/generated/grafana-admin-username

  # Messaging
  kafka-password:
    file: ../../../.secrets/generated/kafka-password
  kafka-ui-password:
    file: ../../../.secrets/generated/kafka-ui-password

  # Search
  typesense-api-key:
    file: ../../../.secrets/generated/typesense-api-key

  # Backend
  keycloak-backend-secret:
    file: ../../../.secrets/generated/keycloak-backend-secret
  bybit-api-key:
    file: ../../../.secrets/generated/bybit-api-key
  bybit-api-secret:
    file: ../../../.secrets/generated/bybit-api-secret
  kucoin-api-key:
    file: ../../../.secrets/generated/kucoin-api-key
  kucoin-api-secret:
    file: ../../../.secrets/generated/kucoin-api-secret
  okx-api-key:
    file: ../../../.secrets/generated/okx-api-key
  okx-api-secret:
    file: ../../../.secrets/generated/okx-api-secret
  kraken-api-key:
    file: ../../../.secrets/generated/kraken-api-key
  kraken-api-secret:
    file: ../../../.secrets/generated/kraken-api-secret
  valr-api-key:
    file: ../../../.secrets/generated/valr-api-key
  valr-api-secret:
    file: ../../../.secrets/generated/valr-api-secret
  bitstamp-api-key:
    file: ../../../.secrets/generated/bitstamp-api-key
  bitstamp-api-secret:
    file: ../../../.secrets/generated/bitstamp-api-secret
  crypto-com-api-key:
    file: ../../../.secrets/generated/crypto-com-api-key
  crypto-com-api-secret:
    file: ../../../.secrets/generated/crypto-com-api-secret
  nedbank-api-key:
    file: ../../../.secrets/generated/nedbank-api-key
  nedbank-api-secret:
    file: ../../../.secrets/generated/nedbank-api-secret

  # API Keys and Service Secrets
  api-key:
    file: ../../../.secrets/generated/api-key

  # SMTP (backend email) - required for production config validation
  smtp-user:
    file: ../../../.secrets/generated/smtp-user
  smtp-password:
    file: ../../../.secrets/generated/smtp-password

  # Keycloak Client Secrets for Compliance Services
  keycloak-compliance-cex-secret:
    file: ../../../.secrets/generated/keycloak-compliance-cex-secret
  keycloak-compliance-dex-secret:
    file: ../../../.secrets/generated/keycloak-compliance-dex-secret
  keycloak-compliance-nft-secret:
    file: ../../../.secrets/generated/keycloak-compliance-nft-secret
  keycloak-compliance-token-secret:
    file: ../../../.secrets/generated/keycloak-compliance-token-secret
  keycloak-compliance-coordinator-secret:
    file: ../../../.secrets/generated/keycloak-compliance-coordinator-secret
