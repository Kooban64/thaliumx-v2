      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: nft_compliance
      DATABASE_USER: thaliumx
      DATABASE_SSL: "true"

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nft_compliance
      DB_USER: thaliumx
      DB_SSL: "true"

