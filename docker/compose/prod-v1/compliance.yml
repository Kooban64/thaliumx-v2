      - |
        export DATABASE_PASSWORD="$(cat /run/secrets/postgres-password)";
        export DB_PASSWORD="$(cat /run/secrets/postgres-password)";
        export REDIS_PASSWORD="$(cat /run/secrets/redis-password)";
        export JWT_SECRET="$(cat /run/secrets/jwt-secret)";
        export API_KEY="$(cat /run/secrets/api-key)";
        export ENCRYPTION_KEY="$(cat /run/secrets/encryption-key)";
        exec su-exec nodejs:nodejs node dist/index.js
    secrets:
      - postgres-password
      - redis-password
      - jwt-secret
      - api-key
      - encryption-key
      - vault-role-id
      - vault-secret-id
    volumes:
      - ./../../certs/ca/ca.crt:/certs/ca.crt:ro
      - ./../../certs/services/postgres/ca.crt:/etc/ssl/certs/postgres-ca.crt:ro
    networks:
