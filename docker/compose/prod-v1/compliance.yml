# ThaliumX Production v1 - Compliance Layer
# ========================================
# Compliance microservices (CEX/DEX/NFT/Token/Coordinator)
# Security goals:
# - No plaintext secrets in compose
# - Use Docker secrets (from prod-v1/base.yml) and runtime export
# - Keep container names and ports consistent with legacy stack

version: '3.8'

services:
  compliance-cex:
    build:
      context: ./../../compliance-cex
      dockerfile: Dockerfile
    image: thaliumx/compliance-cex:1.0.0
    container_name: thaliumx-compliance-cex
    hostname: thaliumx-compliance-cex
    restart: unless-stopped
    # Needs root to read Docker secrets; we drop privileges before starting Node.
    user: "0:0"
    expose:
      - "3001"
    environment:
      # Service
      NODE_ENV: production
      SERVICE_NAME: cex-compliance-service
      PORT: 3001

      # Databases (set both naming conventions to maintain compatibility)
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: cex_compliance
      DATABASE_USER: thaliumx
      DATABASE_SSL: "true"

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cex_compliance
      DB_USER: thaliumx
      DB_SSL: "true"

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

      # Kafka
      # Use in-network PLAINTEXT listener to avoid TLS/SASL drift between services.
      KAFKA_BROKERS: thaliumx-kafka:9094
      KAFKA_SSL: "false"
      KAFKA_CLIENT_ID: cex-compliance-service
      KAFKA_GROUP_ID: cex-compliance-group

      # Vault
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /etc/ssl/certs/ca.crt
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca.crt

      # OIDC (Authentik)
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-https://thaliumx.com/application/o/thaliumx/}
      AUTHENTIK_JWKS_URI: ${AUTHENTIK_JWKS_URI:-https://thaliumx.com/application/o/thaliumx/jwks/}
      AUTHENTIK_AUDIENCE: ${AUTHENTIK_AUDIENCE:-thaliumx-backend}

      # Observability toggles
      METRICS_ENABLED: "true"
      AUDIT_LOG_ENABLED: "true"
      THREAT_DETECTION_ENABLED: "true"

    # Export secrets at runtime (avoid plaintext in compose)
    command:
      - sh
      - -lc
      - |
        export DATABASE_PASSWORD="$(cat /run/secrets/postgres-password)";
        export DB_PASSWORD="$(cat /run/secrets/postgres-password)";
        export REDIS_PASSWORD="$(cat /run/secrets/redis-password)";
        export JWT_SECRET="$(cat /run/secrets/jwt-secret)";
        export API_KEY="$(cat /run/secrets/api-key)";
        export ENCRYPTION_KEY="$(cat /run/secrets/encryption-key)";
        # Disable SASL for PLAINTEXT Kafka
        unset KAFKA_SASL_MECHANISM;
        unset KAFKA_SASL_USERNAME;
        unset KAFKA_SASL_PASSWORD;
        # Drop privileges for the service process
        exec su-exec compliance:compliance node dist/index.js
    secrets:
      - postgres-password
      - redis-password
      - jwt-secret
      - api-key
      - encryption-key
      - vault-role-id
      - vault-secret-id
    volumes:
      - ./../../certs/ca/ca.crt:/etc/ssl/certs/ca.crt:ro
      - ./../../certs/services/postgres/ca.crt:/etc/ssl/certs/postgres-ca.crt:ro
    networks:
      - thaliumx-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      # BusyBox wget does not support `--method=HEAD`; use `--spider` for a lightweight liveness probe.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  compliance-dex:
