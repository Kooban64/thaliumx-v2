        unset KAFKA_SASL_PASSWORD;
        exec su-exec compliance:nodejs node dist/index.js
    secrets:
      - postgres-password
      - redis-password
      - jwt-secret
      - api-key
      - encryption-key
      - vault-role-id
      - vault-secret-id
    volumes:
