        condition: service_healthy
      compliance-dex:
        condition: service_healthy
      compliance-nft:
        condition: service_healthy
      compliance-token:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  thaliumx-net:
    external: true
