# ThaliumX Production v1 - Database Layer
# ======================================
# Distributed databases: Citus, TimescaleDB, MongoDB
# Updated: 2025-12-17T08:59:00.000Z

version: '3.8'

services:
  # ============================================
  # CITUS - Distributed PostgreSQL
  # ============================================
  citus-coordinator:
    image: citusdata/citus:12.1.6
    container_name: thaliumx-citus-coordinator
    hostname: thaliumx-citus-coordinator
    # Run as root to fix bind-mounted TLS key ownership, then drop to postgres.
    user: "0:0"
    restart: unless-stopped
    environment:
      POSTGRES_USER: thaliumx
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_DB: thaliumx_citus
      CITUS_HOST: thaliumx-citus-coordinator
      PGDATA: /var/lib/postgresql/data/pgdata
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    volumes:
      - citus_coordinator_data:/var/lib/postgresql/data
      - ./../../citus/init:/docker-entrypoint-initdb.d:ro
      - ./../../certs/services/citus:/var/lib/postgresql/certs:ro
      - ./../../certs/ca/ca.crt:/var/lib/postgresql/ca.crt:ro
    secrets:
      - postgres-password
    command:
      - sh
      - -lc
      - |
        set -eu
        mkdir -p /tmp/ssl
        cp /var/lib/postgresql/certs/server.crt /tmp/ssl/server.crt
        cp /var/lib/postgresql/certs/server.key /tmp/ssl/server.key
        cp /var/lib/postgresql/ca.crt /tmp/ssl/ca.crt
        chown postgres:postgres /tmp/ssl/server.key
        chmod 600 /tmp/ssl/server.key
        chmod 644 /tmp/ssl/server.crt /tmp/ssl/ca.crt
        exec gosu postgres /usr/lib/postgresql/16/bin/postgres \
          -c shared_preload_libraries=citus \
          -c ssl=on \
          -c ssl_cert_file=/tmp/ssl/server.crt \
          -c ssl_key_file=/tmp/ssl/server.key \
          -c ssl_ca_file=/tmp/ssl/ca.crt
    networks:
      - thaliumx-net
      - database-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thaliumx -d thaliumx_citus"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  citus-worker-1:
    image: citusdata/citus:12.1.6
    container_name: thaliumx-citus-worker-1
    hostname: thaliumx-citus-worker-1
    user: "0:0"
    restart: unless-stopped
    environment:
      POSTGRES_USER: thaliumx
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_DB: thaliumx_citus
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - citus_worker1_data:/var/lib/postgresql/data
      - ./../../certs/services/citus:/var/lib/postgresql/certs:ro
      - ./../../certs/ca/ca.crt:/var/lib/postgresql/ca.crt:ro
    secrets:
      - postgres-password
    command:
      - sh
      - -lc
      - |
        set -eu
        mkdir -p /tmp/ssl
        cp /var/lib/postgresql/certs/server.crt /tmp/ssl/server.crt
        cp /var/lib/postgresql/certs/server.key /tmp/ssl/server.key
        cp /var/lib/postgresql/ca.crt /tmp/ssl/ca.crt
        chown postgres:postgres /tmp/ssl/server.key
        chmod 600 /tmp/ssl/server.key
        chmod 644 /tmp/ssl/server.crt /tmp/ssl/ca.crt
        exec gosu postgres /usr/lib/postgresql/16/bin/postgres \
          -c shared_preload_libraries=citus \
          -c ssl=on \
          -c ssl_cert_file=/tmp/ssl/server.crt \
          -c ssl_key_file=/tmp/ssl/server.key \
          -c ssl_ca_file=/tmp/ssl/ca.crt
    networks:
      - thaliumx-net
      - database-network
    depends_on:
      citus-coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thaliumx -d thaliumx_citus"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  citus-worker-2:
    image: citusdata/citus:12.1.6
    container_name: thaliumx-citus-worker-2
    hostname: thaliumx-citus-worker-2
    user: "0:0"
    restart: unless-stopped
    environment:
      POSTGRES_USER: thaliumx
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_DB: thaliumx_citus
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - citus_worker2_data:/var/lib/postgresql/data
      - ./../../certs/services/citus:/var/lib/postgresql/certs:ro
      - ./../../certs/ca/ca.crt:/var/lib/postgresql/ca.crt:ro
    secrets:
      - postgres-password
    command:
      - sh
      - -lc
      - |
        set -eu
        mkdir -p /tmp/ssl
        cp /var/lib/postgresql/certs/server.crt /tmp/ssl/server.crt
        cp /var/lib/postgresql/certs/server.key /tmp/ssl/server.key
        cp /var/lib/postgresql/ca.crt /tmp/ssl/ca.crt
        chown postgres:postgres /tmp/ssl/server.key
        chmod 600 /tmp/ssl/server.key
        chmod 644 /tmp/ssl/server.crt /tmp/ssl/ca.crt
        exec gosu postgres /usr/lib/postgresql/16/bin/postgres \
          -c shared_preload_libraries=citus \
          -c ssl=on \
          -c ssl_cert_file=/tmp/ssl/server.crt \
          -c ssl_key_file=/tmp/ssl/server.key \
          -c ssl_ca_file=/tmp/ssl/ca.crt
    networks:
      - thaliumx-net
      - database-network
    depends_on:
      citus-coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thaliumx -d thaliumx_citus"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================
  # TIMESCALEDB - Time-Series Database
  # ============================================
  timescaledb:
    # IMPORTANT: this must match the TimescaleDB extension version already present in the persisted data dir.
    # The current persistent volume expects `timescaledb-2.24.0` (observed in container logs).
    image: timescale/timescaledb:2.24.0-pg16
    container_name: thaliumx-timescaledb
    hostname: thaliumx-timescaledb
    user: "0:0"
    restart: unless-stopped
    environment:
      POSTGRES_USER: dingir
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_DB: exchange
      TIMESCALEDB_TELEMETRY: "off"
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./../../certs/services/timescaledb:/var/lib/postgresql/certs:ro
      - ./../../certs/ca/ca.crt:/var/lib/postgresql/ca.crt:ro
    secrets:
      - postgres-password
    command:
      - sh
      - -lc
      - |
        set -eu
        mkdir -p /tmp/ssl
        cp /var/lib/postgresql/certs/server.crt /tmp/ssl/server.crt
        cp /var/lib/postgresql/certs/server.key /tmp/ssl/server.key
        cp /var/lib/postgresql/ca.crt /tmp/ssl/ca.crt
        chown postgres:postgres /tmp/ssl/server.key
        chmod 600 /tmp/ssl/server.key
        chmod 644 /tmp/ssl/server.crt /tmp/ssl/ca.crt
        exec su-exec postgres postgres \
          -c ssl=on \
          -c ssl_cert_file=/tmp/ssl/server.crt \
          -c ssl_key_file=/tmp/ssl/server.key \
          -c ssl_ca_file=/tmp/ssl/ca.crt
    networks:
      - thaliumx-net
      - database-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dingir -d exchange"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================
  # MONGODB - Document Store
  # ============================================
  mongodb:
    image: mongo:8.2
    container_name: thaliumx-mongodb
    # Run as root so Mongo can read Docker secrets (default mode can be 0400).
    # The image entrypoint will drop privileges for `mongod`.
    user: "0:0"
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: thaliumx
      # NOTE: docker-compose secrets mount `/run/secrets` as root-only (0700) on many setups.
      # Mongo's entrypoint may read the password file after dropping privileges, causing EACCES.
      # Bind-mount the password to an accessible path instead.
      MONGO_INITDB_ROOT_PASSWORD_FILE: /tmp/secrets/mongodb-password
      MONGO_INITDB_DATABASE: thaliumx
    volumes:
      - mongodb-data:/data/db
      - ./../../certs/services/mongodb:/certs:ro
      - ./../../../.secrets/generated/mongodb-password:/tmp/secrets/mongodb-password:ro
    command:
      - mongod
      - --auth
      - --bind_ip_all
      - --dbpath
      - /data/db
      - --logpath
      - /data/db/mongod.log
      - --maxConns
      - "1000"
      - --wiredTigerCacheSizeGB
      - "2"
      - --setParameter
      - ttlMonitorSleepSecs=60
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    networks:
      - thaliumx-net
      - database-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$$(cat /tmp/secrets/mongodb-password)\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\" >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
