# ThaliumX Production v1 - Fintech Layer
# =====================================
# Ballerine (KYC/KYB workflow) + BlnkFinance
# Note: Fintech stack retains env-var injection for secrets (provided at deploy time).

version: '3.8'

services:
  ballerine-postgres:
    profiles: ["non-audit"]
    image: sibedge/postgres-plv8:15.3-3.1.7
    container_name: thaliumx-ballerine-postgres
    hostname: thaliumx-ballerine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ballerine
      # Prefer loading the real password from a Docker secret (generated by platform tooling).
      POSTGRES_PASSWORD_FILE: /run/secrets/ballerine-db-password
      POSTGRES_DB: ballerine
    secrets:
      - ballerine-db-password
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    volumes:
      - ballerine_postgres_data:/var/lib/postgresql/data
    networks:
      - thaliumx-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballerine -d ballerine"]
      interval: 10s
      timeout: 5s
      retries: 5

  ballerine-workflow:
    profiles: ["non-audit"]
    # Build from the vendored Ballerine source in this repo by default.
    # Keep `image:` so operators can pin/tag the built image (or pull+run with `--no-build`).
    build:
      context: ./../../fintech/ballerine/services/workflows-service
      dockerfile: Dockerfile
      target: prod
      args:
        RELEASE: ${BALLERINE_RELEASE:-unknown}
        SHORT_SHA: ${BALLERINE_SHORT_SHA:-}
    image: ${BALLERINE_WORKFLOW_IMAGE:-ghcr.io/ballerine-io/workflows-service:latest}
    container_name: thaliumx-ballerine-workflow
    hostname: thaliumx-ballerine-workflow
    restart: unless-stopped
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_TOKEN: CHANGEME__SET_VIA_SECRETS
      VAULT_SECRET_PATH: kv/data/fintech/ballerine
      DB_USER: ballerine
      DB_HOST: thaliumx-ballerine-postgres
      DB_PORT: "5432"
      DB_NAME: ballerine
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: "3000"
      COMPOSE_PROJECT_NAME: thaliumx
      ENVIRONMENT_NAME: production
      BACKOFFICE_CORS_ORIGIN: http://localhost:3004
      WORKFLOW_DASHBOARD_CORS_ORIGIN: http://localhost:3004
      HEADLESS_EXAMPLE_CORS_ORIGIN: http://localhost:3004
      KYB_EXAMPLE_CORS_ORIGIN: http://localhost:3004
      UNIFIED_API_URL: http://thaliumx-ballerine-workflow:3000
      APP_API_URL: http://localhost:3003
      JWT_EXPIRATION: 1d
      MAIL_ADAPTER: log
      # Values below are set at runtime from Docker secrets in the entrypoint wrapper.
      # (We keep the env keys here for clarity of what the service expects.)
      DB_URL: CHANGEME__SET_VIA_SECRETS
      DATABASE_URL: CHANGEME__SET_VIA_SECRETS
      REDIS_URL: redis://thaliumx-redis:6379
      JWT_SECRET_KEY: CHANGEME__SET_VIA_SECRETS
      SESSION_SECRET: ballerine_session_secret_2025_production_secure_ThaliumX_32_chars
      API_KEY: ballerine_api_key_2025_production_secure_ThaliumX_48_chars_alphanum
      # Set in the entrypoint wrapper below (to avoid docker-compose `$` interpolation pitfalls).
      BCRYPT_SALT: CHANGEME__SET_VIA_ENTRYPOINT
      HASHING_KEY_SECRET_BASE64: YmFsbGVyaW5lX2hhc2hpbmdfa2V5XzIwMjVfc2VjdXJlX1RoYWxpdW1Y
      WEBHOOK_SECRET: ballerine_webhook_secret_2025_production_secure_ThaliumX_64_chars
      ENCRYPTION_KEY: ballerine_encryption_key_2025_production_secure_ThaliumX_32_chars
      WORKFLOW_TOKEN: ballerine_workflow_token_2025_production_secure_ThaliumX_48_chars
      COLLECTION_FLOW_TOKEN: ballerine_collection_flow_token_2025_production_secure_ThaliumX_48_chars
      NOTION_API_KEY: ""
      MAGIC_LINK_JWT_SECRET: ballerine_magic_link_jwt_secret_2025_production_secure_ThaliumX_64_chars
      MAGIC_LINK_AUTH_JWT_SECRET: ballerine_magic_link_auth_jwt_secret_2025_production_secure_ThaliumX_64_chars
      # Keycloak OIDC Configuration
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-true}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/auth/realms/thaliumx/protocol/openid-connect/certs}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://auth.thaliumx.com/auth/realms/thaliumx}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      DEFAULT_PROJECT_ID: ${DEFAULT_PROJECT_ID:-}
      # Security controls for Keycloak user creation
      KEYCLOAK_ALLOWED_EMAIL_DOMAINS: ${KEYCLOAK_ALLOWED_EMAIL_DOMAINS:-}
      KEYCLOAK_REQUIRE_ADMIN_APPROVAL: ${KEYCLOAK_REQUIRE_ADMIN_APPROVAL:-false}
      KEYCLOAK_USER_CREATION_RATE_LIMIT: ${KEYCLOAK_USER_CREATION_RATE_LIMIT:-5}
      KEYCLOAK_ALLOWED_ROLES: ${KEYCLOAK_ALLOWED_ROLES:-}
    secrets:
      - ballerine-db-password
      - ballerine-bcrypt-salt
      - redis-password
      - ballerine-jwt-secret-key
      - ballerine-session-secret
      - ballerine-api-key
      - ballerine-webhook-secret
      - ballerine-encryption-key
      - ballerine-workflow-token
      - ballerine-collection-flow-token
      - ballerine-magic-link-jwt-secret
      - ballerine-magic-link-auth-jwt-secret
    entrypoint: ["sh", "-lc"]
    command:
      - |
        set -eu
        # NOTE: docker-compose performs host-side interpolation for `$VAR`.
        # Use `$$` to defer expansion to the container shell.
        uri_encode_all() {
          # Percent-encode ALL bytes of the input so passwords with any special chars are safe in DSNs.
          # Keep this dependency-free (no python/jq) for slimmer images.
          printf '%s' "$$1" | od -An -tx1 -v | tr -d ' \n' | sed 's/../%&/g'
        }

        # Postgres init for this service uses a fixed user.
        db_user="ballerine";
        db_pass_raw="$$(cat /run/secrets/ballerine-db-password | tr -d '\n')";
        # DB password is embedded in a URI -> must be percent-encoded.
        db_pass_uri="$$(uri_encode_all "$$db_pass_raw")";
        export DB_URL="postgresql://$$db_user:$$db_pass_uri@thaliumx-ballerine-postgres:5432/ballerine";
        export DATABASE_URL="postgresql://$$db_user:$$db_pass_uri@thaliumx-ballerine-postgres:5432/ballerine";

        redis_pass_raw="$$(cat /run/secrets/redis-password | tr -d '\n')";
        redis_pass_uri="$$(uri_encode_all "$$redis_pass_raw")";
        export REDIS_URL="redis://:$$redis_pass_uri@thaliumx-redis:6379";

        export BCRYPT_SALT="$$(cat /run/secrets/ballerine-bcrypt-salt | tr -d '\r\n')";

        export JWT_SECRET_KEY="$$(cat /run/secrets/ballerine-jwt-secret-key)";
        export SESSION_SECRET="$$(cat /run/secrets/ballerine-session-secret)";
        export API_KEY="$$(cat /run/secrets/ballerine-api-key)";
        # Per [`deprecated.docs/BALLERINE_CONFIGURATION.md`](deprecated.docs/BALLERINE_CONFIGURATION.md:1):
        # `HASHING_KEY_SECRET_BASE64` takes precedence and MUST decode to a valid bcrypt salt.
        # Our platform runs with a plain bcrypt salt, so we force the non-base64 variant.
        unset HASHING_KEY_SECRET_BASE64;
        export HASHING_KEY_SECRET="$$BCRYPT_SALT";
        export WEBHOOK_SECRET="$$(cat /run/secrets/ballerine-webhook-secret)";
        export ENCRYPTION_KEY="$$(cat /run/secrets/ballerine-encryption-key)";
        export WORKFLOW_TOKEN="$$(cat /run/secrets/ballerine-workflow-token)";
        export COLLECTION_FLOW_TOKEN="$$(cat /run/secrets/ballerine-collection-flow-token)";
        export MAGIC_LINK_JWT_SECRET="$$(cat /run/secrets/ballerine-magic-link-jwt-secret)";
        export MAGIC_LINK_AUTH_JWT_SECRET="$$(cat /run/secrets/ballerine-magic-link-auth-jwt-secret)";
        exec dumb-init npm run prod
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    networks:
      - thaliumx-net
    depends_on:
      ballerine-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:3000/api/v1/_health/live', (res) => { process.exit(res.statusCode === 204 || res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  ballerine-backoffice:
    profiles: ["non-audit"]
    # Build from the vendored Ballerine source in this repo by default.
    # Keep `image:` so operators can pin/tag the built image (or pull+run with `--no-build`).
    build:
      context: ./../../fintech/ballerine/apps/backoffice-v2
      dockerfile: Dockerfile
      target: prod
    image: ${BALLERINE_BACKOFFICE_IMAGE:-ghcr.io/ballerine-io/backoffice:latest}
    container_name: thaliumx-ballerine-backoffice
    hostname: thaliumx-ballerine-backoffice
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3003
      VITE_AUTH_ENABLED: ${BALLERINE_BACKOFFICE_AUTH_ENABLED:-true}
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    networks:
      - thaliumx-net
    depends_on:
      ballerine-workflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5

  blnkfinance-migrate:
    profiles: ["non-audit"]
    image: thaliumx/blnkfinance:1.0.0
    container_name: thaliumx-blnkfinance-migrate
    hostname: thaliumx-blnkfinance-migrate
    restart: "no"
    environment:
      # Values are populated at runtime in the `command` block.
      # Keep placeholders here only for documentation clarity.
      BLNK_DATA_SOURCE_DNS: CHANGEME__SET_VIA_ENTRYPOINT
      BLNK_REDIS_DNS: CHANGEME__SET_VIA_ENTRYPOINT
    command:
      - sh
      - -lc
      - |
        # NOTE: docker-compose performs host-side interpolation for `$VAR`.
        # Use `$$` to defer expansion to the container shell.
        uri_encode_all() {
          # Percent-encode ALL bytes of the input so passwords with any special chars are safe in DSNs.
          # This is intentionally dependency-free (no python/jq) for the slim runtime image.
          printf '%s' "$$1" | od -An -tx1 -v | tr -d ' \n' | sed 's/../%&/g'
        }

        pg_pass_raw="$$(cat /run/secrets/postgres-password | tr -d '\n')"
        pg_pass_uri="$$(uri_encode_all "$$pg_pass_raw")"

        redis_pass_raw="$$(cat /run/secrets/redis-password | tr -d '\n')"
        redis_pass_uri="$$(uri_encode_all "$$redis_pass_raw")"

        export BLNK_DATA_SOURCE_DNS="postgresql://thaliumx:$$pg_pass_uri@postgres:5432/blnkfinance?sslmode=require";
        export BLNK_REDIS_DNS="redis://:$$redis_pass_uri@thaliumx-redis:6379";
        exec /usr/local/bin/blnk migrate up
    secrets:
      - postgres-password
      - redis-password
    networks:
      - thaliumx-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  blnkfinance:
    profiles: ["non-audit"]
    build:
      context: ./../../fintech/blnkfinance
      dockerfile: Dockerfile
      args:
        BLNK_VERSION: v0.7.0
    image: thaliumx/blnkfinance:1.0.0
    container_name: thaliumx-blnkfinance
    hostname: thaliumx-blnkfinance
    restart: unless-stopped
    environment:
      TZ: UTC
      BLNK_SERVER_PORT: "5001"
      BLNK_ENABLE_TELEMETRY: "false"
      REDIS_HOST: thaliumx-redis
      REDIS_PORT: "6379"
      # Values are populated at runtime in the `command` block.
      REDIS_PASSWORD: CHANGEME__SET_VIA_ENTRYPOINT
      BLNK_DATA_SOURCE_DNS: CHANGEME__SET_VIA_ENTRYPOINT
      BLNK_REDIS_DNS: CHANGEME__SET_VIA_ENTRYPOINT
    command:
      - sh
      - -lc
      - |
        # NOTE: docker-compose performs host-side interpolation for `$VAR`.
        # Use `$$` to defer expansion to the container shell.
        uri_encode_all() {
          printf '%s' "$$1" | od -An -tx1 -v | tr -d ' \n' | sed 's/../%&/g'
        }

        pg_pass_raw="$$(cat /run/secrets/postgres-password | tr -d '\n')"
        pg_pass_uri="$$(uri_encode_all "$$pg_pass_raw")"

        redis_pass_raw="$$(cat /run/secrets/redis-password | tr -d '\n')"
        redis_pass_uri="$$(uri_encode_all "$$redis_pass_raw")"

        export BLNK_DATA_SOURCE_DNS="postgresql://thaliumx:$$pg_pass_uri@postgres:5432/blnkfinance?sslmode=require";
        export BLNK_REDIS_DNS="redis://:$$redis_pass_uri@thaliumx-redis:6379";
        # For libraries that take a raw password (not a URI), keep it unencoded.
        export REDIS_PASSWORD="$$redis_pass_raw";
        export REDIS_HOST="thaliumx-redis";
        export REDIS_PORT="6379";
        exec /usr/local/bin/blnk start
    secrets:
      - postgres-password
      - redis-password
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    volumes:
      - ./../../fintech/blnkfinance/blnk.json:/app/blnk.json:ro
      - blnkfinance_data:/app/data
    networks:
      - thaliumx-net
    depends_on:
      blnkfinance-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5001/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  ballerine_postgres_data:
    name: thaliumx-ballerine-postgres-data
  blnkfinance_data:
    name: thaliumx-blnkfinance-data

networks:
  thaliumx-net:
    external: true
