# ThaliumX Production v1 - Gateway Layer
# ====================================
# API Gateway and routing: APISIX, etcd
# Status: Production Ready
# Updated: 2025-12-17T13:19:15.000Z

version: '3.8'

services:
  # etcd - Configuration Store for APISIX
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: thaliumx-etcd
    hostname: thaliumx-etcd
    command:
      - etcd
      - --name=thaliumx-etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://thaliumx-etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://thaliumx-etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=thaliumx-etcd=http://thaliumx-etcd:2380
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    volumes:
      - etcd_data:/etcd-data
      - ./certs/services/etcd/server.crt:/certs/server.crt:ro
      - ./certs/services/etcd/server.key:/certs/server.key:ro
      - ./certs/ca/ca.crt:/certs/ca.crt:ro
    networks:
      - thaliumx-net
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    labels:
      - "com.thaliumx.service=etcd"
      - "com.thaliumx.component=gateway"
      - "com.thaliumx.description=Configuration Store for APISIX"

  # APISIX - API Gateway
  apisix:
    image: apache/apisix:3.11.0-debian
    container_name: thaliumx-apisix
    hostname: thaliumx-apisix
    # NOTE: APISIX image runs as non-root by default.
    # We need root here to read the Admin API key (bind-mounted as a "secret")
    # and the TLS private key, then hand off to the standard entrypoint.
    user: "0:0"
    environment:
      APISIX_STAND_ALONE: "false"
    # Strict audit mode: load the Admin API key from Docker secrets at runtime.
    secrets:
      - api-key
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        set -eu

        export APISIX_ADMIN_KEY="$(cat /run/secrets/api-key)";
        export APISIX_ID="thaliumx-apisix";

        # Render ETCD-backed APISIX config (inject Admin API key from secret).
        # NOTE: we do this at runtime to avoid relying on APISIX env-substitution behavior.
        # IMPORTANT: APISIX reads /usr/local/apisix/conf/config.yaml (not apisix.yaml) when running in etcd mode.
        # Escape replacement so sed doesn't break if the key contains '/' or '&'.
        # NOTE: docker-compose performs host-side env interpolation for $VAR / ${VAR}.
        # Use $$ to defer expansion to the container shell.
        esc_key="$(printf '%s' "$$APISIX_ADMIN_KEY" | sed 's/[\/&]/\\&/g')";
        sed "s/__APISIX_ADMIN_KEY__/$$esc_key/g" /config/apisix.yaml > /usr/local/apisix/conf/config.yaml;

        # Fail fast if placeholder replacement didn't happen.
        if grep -q '__APISIX_ADMIN_KEY__' /usr/local/apisix/conf/config.yaml; then
          echo "ERROR: APISIX admin key placeholder was not replaced" >&2;
          exit 1;
        fi

        # Keep a copy of the platform TLS material available for init scripts.
        mkdir -p /tmp/certs;
        cp /usr/local/apisix/certs/server.crt /tmp/certs/;
        cp /usr/local/apisix/certs/server.key /tmp/certs/;
        chmod 644 /tmp/certs/server.crt;
        chmod 600 /tmp/certs/server.key;
        exec /docker-entrypoint.sh docker-start
    volumes:
      # Mount the config file (rendered into /usr/local/apisix/conf/config.yaml at runtime)
      # NOTE: gateway.yml is located at docker/compose/prod-v1/
      # so ../../apisix/... resolves to docker/apisix/... (correct).
      - ./../../apisix/config/apisix-etcd.yaml:/config/apisix.yaml:ro
      - apisix_logs:/usr/local/apisix/logs
      - /home/ubuntu/thaliumx-v1/docker/certs/services/apisix:/usr/local/apisix/certs:ro
      - /home/ubuntu/thaliumx-v1/docker/certs/ca/ca.crt:/usr/local/apisix/certs/ca.crt:ro
    # Strict audit mode: APISIX is the ONLY externally exposed entrypoint.
    # Map host 80/443 to APISIX 9080/443.
    ports:
      - "80:9080"        # HTTP
      - "443:443"        # HTTPS
    # Ensure the gateway can resolve its own public auth hostname for OIDC backchannel calls.
    # This avoids relying on external DNS from inside the container and prevents issuer mismatches
    # when APISIX openid-connect uses the public discovery URL.
    # NOTE: mapping to 127.0.0.1 targets the APISIX container itself.
    extra_hosts:
      - "auth.thaliumx.com:127.0.0.1"
      - "thaliumx.com:127.0.0.1"
      - "thal.thaliumx.com:127.0.0.1"
      - "api.thaliumx.com:127.0.0.1"
    networks:
      - thaliumx-net
    depends_on:
      etcd:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    labels:
      - "com.thaliumx.service=apisix"
      - "com.thaliumx.component=gateway"
      - "com.thaliumx.description=API Gateway"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9080'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # APISIX Route Initializer
  # - Configures host routing for thaliumx.com and thal.thaliumx.com
  # - Creates an SSL object for thaliumx.com/*.thaliumx.com
  # - Stores all objects in ETCD (persistent across container rebuilds)
  apisix-init:
    image: alpine:3.20
    container_name: thaliumx-apisix-init
    hostname: thaliumx-apisix-init
    restart: "no"
    depends_on:
      apisix:
        condition: service_healthy
    secrets:
      - api-key
      # Used to configure APISIX openid-connect (bearer_only) plugin.
      # NOTE: APISIX openid-connect schema requires `client_secret`.
      - apisix-oidc-client-secret
      - redis-password
    environment:
      # Keycloak decommissioned; Zitadel is the only supported auth provider.
      THALIUMX_AUTH_PROVIDER: ${THALIUMX_AUTH_PROVIDER:-zitadel}
      APISIX_ENABLE_OIDC: ${APISIX_ENABLE_OIDC:-true}
    volumes:
      - /home/ubuntu/thaliumx-v1/docker/gateway/scripts/init-apisix-routes.sh:/scripts/init-apisix-routes.sh:ro
      # Provide TLS material so the init script can create an APISIX SSL object (stored in ETCD).
      - /home/ubuntu/thaliumx-v1/docker/certs/services/apisix:/certs/apisix:ro
      - /home/ubuntu/thaliumx-v1/docker/certs/ca/ca.crt:/certs/ca.crt:ro
    entrypoint: ["sh", "-lc"]
    command:
      - |
        apk add --no-cache bash curl ca-certificates >/dev/null;
        export APISIX_ADMIN_URL="http://thaliumx-apisix:9180/apisix/admin";
        export APISIX_ADMIN_KEY="$(cat /run/secrets/api-key)";
        export FRONTEND_UPSTREAM="thaliumx-frontend:3000";
        export BACKEND_UPSTREAM="thaliumx-backend:3002";
        # Auth provider selection (Keycloak decommissioned)
        export AUTH_PROVIDER="zitadel";
        export ZITADEL_UPSTREAM="zitadel:8080";

        # Configure APISIX OIDC verification.
        export OIDC_CLIENT_ID="thaliumx-backend";
        export OIDC_CLIENT_SECRET="$(cat /run/secrets/apisix-oidc-client-secret)";
        # Enable gateway-side OIDC enforcement for protected APIs.
        # Frontend is Keycloak-first and sends Bearer tokens.
        export APISIX_ENABLE_OIDC="${APISIX_ENABLE_OIDC:-true}";
        # Redis configuration for rate limiting
        export REDIS_HOST="${REDIS_HOST:-thaliumx-redis}";
        export REDIS_PORT="${REDIS_PORT:-6379}";
        export REDIS_DATABASE="${REDIS_DATABASE:-0}";
        if [ -f /run/secrets/redis-password ]; then
          export REDIS_PASSWORD="$(cat /run/secrets/redis-password)";
        fi
        # OPA configuration (HTTPS with TLS verification)
        export OPA_HOST="${OPA_HOST:-https://thaliumx-opa:8181}";
        export OPA_POLICY="${OPA_POLICY:-thaliumx/authz}";
        export OPA_SSL_VERIFY="${OPA_SSL_VERIFY:-true}";
        bash /scripts/init-apisix-routes.sh
    networks:
      - thaliumx-net

  # APISIX Dashboard - Management Interface
  apisix-dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    container_name: thaliumx-apisix-dashboard
    hostname: thaliumx-apisix-dashboard
    environment:
      APISIX_DASHBOARD_CONFIG_FILE: /usr/local/apisix-dashboard/conf/conf.yaml
    # Render dashboard config at runtime to avoid committing credentials.
    secrets:
      - api-key
    entrypoint: ["sh", "-lc"]
    command:
      - |
        set -eu
        apk add --no-cache openssl >/dev/null 2>&1 || true
        API_KEY="$(cat /run/secrets/api-key)"
        # Use $$ to prevent docker-compose from interpolating shell variables at parse time.
        DASHBOARD_SECRET="$(printf '%s' "$$API_KEY" | openssl dgst -sha256 | awk '{print $2}')"
        DASHBOARD_PASSWORD="$$API_KEY"

        sed \
          -e "s/__APISIX_DASHBOARD_SECRET__/$$DASHBOARD_SECRET/g" \
          -e "s/__APISIX_DASHBOARD_PASSWORD__/$$DASHBOARD_PASSWORD/g" \
          /config/conf.yaml > /usr/local/apisix-dashboard/conf/conf.yaml

        exec /usr/local/apisix-dashboard/manager-api
    volumes:
      - /home/ubuntu/thaliumx-v1/docker/apisix/config/dashboard.yaml:/config/conf.yaml:ro
    # Strict audit mode: no host-exposed ports (access via internal network / gateway routes only).
    networks:
      - thaliumx-net
    depends_on:
      apisix:
        condition: service_healthy
    healthcheck:
      # NOTE: `localhost` may resolve to IPv6 (::1) first. The dashboard binds 127.0.0.1 only.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    labels:
      - "com.thaliumx.service=apisix-dashboard"
      - "com.thaliumx.component=gateway"
      - "com.thaliumx.description=APISIX Management Dashboard"

volumes:
   etcd_data:
     name: thaliumx-etcd-data
   apisix_logs:
     name: thaliumx-apisix-logs
   apisix_config:
     name: thaliumx-apisix-config

networks:
  thaliumx-net:
    external: true
