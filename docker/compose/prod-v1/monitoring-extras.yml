# ThaliumX Production v1 - Monitoring Extras
# =========================================
# Additional observability components present in the legacy stack.

version: '3.8'

services:
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: thaliumx-blackbox-exporter
    hostname: thaliumx-blackbox-exporter
    restart: unless-stopped
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    volumes:
      - ./../../observability/config/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - thaliumx-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9115/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: thaliumx-cadvisor
    hostname: thaliumx-cadvisor
    restart: unless-stopped
    # Strict audit mode: no privileged containers.
    privileged: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - thaliumx-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: thaliumx-postgres-exporter
    hostname: thaliumx-postgres-exporter
    restart: unless-stopped
    # Image entrypoint is the exporter binary; override to run a shell wrapper that loads secrets.
    entrypoint: ["sh", "-lc"]
    # Use list form so Docker receives the entire script as a single argv element.
    command:
      - |
        uri_encode_all() {
          # Percent-encode ALL bytes of the input so passwords with any special chars are safe in DSNs.
          # Keep this dependency-free (no python/jq) for slimmer images.
          printf '%s' "$$1" | od -An -tx1 -v | tr -d ' \n' | sed 's/../%&/g'
        }

        postgres_pass_raw="$$(cat /run/secrets/postgres-password | tr -d '\n')";
        postgres_pass_uri="$$(uri_encode_all "$$postgres_pass_raw")";
        # Use $$ to prevent docker-compose interpolation; let the container shell expand it.
        export DATA_SOURCE_NAME="postgresql://thaliumx:$$postgres_pass_uri@postgres:5432/thaliumx?sslmode=disable";
        exec /bin/postgres_exporter
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    secrets:
      - postgres-password
    networks:
      - thaliumx-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # postgres_exporter exposes /metrics (no /health endpoint).
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis-exporter:
    # Strict audit mode: use password-file flag (no plaintext secret env var).
    image: oliver006/redis_exporter:v1.62.0
    container_name: thaliumx-redis-exporter
    hostname: thaliumx-redis-exporter
    restart: unless-stopped
    # Needs root to read Docker secrets under /run/secrets on many hosts.
    user: "0:0"
    command:
      - "-redis.addr=redis://redis:6379"
      - "-redis.password-file=/run/secrets/redis-exporter-passwords"
    secrets:
      - source: redis-exporter-passwords
        target: redis-exporter-passwords
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    networks:
      - thaliumx-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/redis_exporter", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  thaliumx-net:
    external: true
