# ThaliumX Production v1 - Full Stack
# ===================================
# Complete production deployment combining all layers
# Updated: 2025-12-17T09:00:20.000Z

version: '3.8'

# This file combines all layers for full production deployment
# Use with: docker compose -f compose/prod-v1/base.yml -f compose/prod-v1/production.yml up -d

services:
  # Include all services from other layers
  # This is a reference file - actual services defined in layer files

  # Infrastructure Layer
  vault:
    extends:
      file: infrastructure.yml
      service: vault

  postgres:
    extends:
      file: infrastructure.yml
      service: postgres

  redis:
    extends:
      file: infrastructure.yml
      service: redis

  # Database Layer
  citus-coordinator:
    extends:
      file: databases.yml
      service: citus-coordinator

  citus-worker-1:
    extends:
      file: databases.yml
      service: citus-worker-1

  citus-worker-2:
    extends:
      file: databases.yml
      service: citus-worker-2

  timescaledb:
    extends:
      file: databases.yml
      service: timescaledb

  mongodb:
    extends:
      file: databases.yml
      service: mongodb

  # Applications Layer
  keycloak:
    extends:
      file: applications.yml
      service: keycloak

  backend:
    extends:
      file: applications.yml
      service: backend

  frontend:
    extends:
      file: applications.yml
      service: frontend

  # Messaging Layer
  kafka:
    extends:
      file: messaging.yml
      service: kafka

  kafka-init:
    extends:
      file: messaging.yml
      service: kafka-init

  kafka-ui:
    extends:
      file: messaging.yml
      service: kafka-ui

  schema-registry:
    extends:
      file: messaging.yml
      service: schema-registry

  # Security Layer
  opa:
    extends:
      file: security.yml
      service: opa

  # Gateway Layer
  apisix:
    extends:
      file: gateway.yml
      service: apisix

  apisix-init:
    extends:
      file: gateway.yml
      service: apisix-init

  apisix-dashboard:
    extends:
      file: gateway.yml
      service: apisix-dashboard

  etcd:
    extends:
      file: gateway.yml
      service: etcd

  # Monitoring Layer
  prometheus:
    extends:
      file: monitoring.yml
      service: prometheus

  grafana:
    extends:
      file: monitoring.yml
      service: grafana

  loki:
    extends:
      file: monitoring.yml
      service: loki

  tempo:
    extends:
      file: monitoring.yml
      service: tempo

  promtail:
    extends:
      file: monitoring.yml
      service: promtail

  alertmanager:
    extends:
      file: monitoring.yml
      service: alertmanager

  otel-collector:
    extends:
      file: monitoring.yml
      service: otel-collector

  # Monitoring Extras
  blackbox-exporter:
    extends:
      file: monitoring-extras.yml
      service: blackbox-exporter

  cadvisor:
    extends:
      file: monitoring-extras.yml
      service: cadvisor

  postgres-exporter:
    extends:
      file: monitoring-extras.yml
      service: postgres-exporter

  redis-exporter:
    extends:
      file: monitoring-extras.yml
      service: redis-exporter

  # Search
  typesense:
    extends:
      file: search.yml
      service: typesense

  # Trading
  dingir-matchengine:
    extends:
      file: trading.yml
      service: dingir-matchengine

  dingir-restapi:
    extends:
      file: trading.yml
      service: dingir-restapi

  liquibook:
    extends:
      file: trading.yml
      service: liquibook

  quantlib:
    extends:
      file: trading.yml
      service: quantlib

  # Fintech
  ballerine-postgres:
    extends:
      file: fintech.yml
      service: ballerine-postgres

  ballerine-workflow:
    extends:
      file: fintech.yml
      service: ballerine-workflow

  ballerine-backoffice:
    extends:
      file: fintech.yml
      service: ballerine-backoffice

  blnkfinance-migrate:
    extends:
      file: fintech.yml
      service: blnkfinance-migrate

  blnkfinance:
    extends:
      file: fintech.yml
      service: blnkfinance

  # Compliance
  compliance-cex:
    extends:
      file: compliance.yml
      service: compliance-cex

  compliance-dex:
    extends:
      file: compliance.yml
      service: compliance-dex

  compliance-nft:
    extends:
      file: compliance.yml
      service: compliance-nft

  compliance-token:
    extends:
      file: compliance.yml
      service: compliance-token

  compliance-coordinator:
    extends:
      file: compliance.yml
      service: compliance-coordinator

  # Wazuh SIEM/XDR
  wazuh-manager:
    extends:
      file: wazuh.yml
      service: wazuh-manager

  wazuh-indexer:
    extends:
      file: wazuh.yml
      service: wazuh-indexer

  wazuh-dashboard:
    extends:
      file: wazuh.yml
      service: wazuh-dashboard

volumes:
  etcd_data:
    name: thaliumx-etcd-data
  apisix_logs:
    name: thaliumx-apisix-logs
