# ThaliumX Production v1 - Trading Layer (SAFE INTEGRATION VERSION)
# ================================================================
# Dingir (matchengine + restapi), Liquibook, QuantLib
# Modified for current infrastructure:
# - Environment variables instead of Docker secrets (non-Swarm mode)
# - Corrected Kafka port (9092 instead of 9094)
# - Default passwords for initial testing

version: '3.8'

services:
  dingir-matchengine:
    build:
      context: ./../../trading/dingir
      dockerfile: Dockerfile
    image: thaliumx/dingir:latest
    container_name: thaliumx-dingir-matchengine
    hostname: thaliumx-dingir-matchengine
    restart: unless-stopped
    command:
      - sh
      - -lc
      - |
        # Use environment variables for secrets (secrets not available in non-Swarm mode)
        export TIMESCALE_USER="dingir";
        export TIMESCALE_DB="exchange";
        export TIMESCALE_PASSWORD="${TIMESCALE_PASSWORD}";
        # Use $ to prevent docker-compose variable substitution; container shell will expand $TIMESCALE_*.
        export DATABASE_URL="postgresql://$TIMESCALE_USER:$TIMESCALE_PASSWORD@timescaledb:5432/$TIMESCALE_DB";
        # Set Dingir config environment variables
        export DB_PASSWORD="${TIMESCALE_PASSWORD}";
        export DB_LOG="postgresql://$TIMESCALE_USER:$DB_PASSWORD@timescaledb:5432/$TIMESCALE_DB";
        export DB_HISTORY="postgresql://$TIMESCALE_USER:$DB_PASSWORD@timescaledb:5432/$TIMESCALE_DB";
        echo "DB_LOG=$DB_LOG";
        export REDIS_PASSWORD="${REDIS_PASSWORD}";
        export REDIS_HOST="redis";
        export REDIS_PORT=6379;
        # Use PLAINTEXT Kafka (corrected port for current setup)
        export BROKERS="thaliumx-kafka:9092";
        echo "DB_LOG=$DB_LOG";
        echo "BROKERS=$BROKERS";
        # Use HTTP Vault (as in working legacy config)
        export VAULT_ADDR="http://vault:8200";
        export VAULT_TOKEN="${VAULT_TOKEN}";
        # Disable Kafka persistence to avoid startup issues
        export DINGIR_PERSIST_TO_MQ="false";
        exec ./matchengine
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      RUN_MODE: ${RUN_MODE:-production}
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    volumes:
      - dingir_data:/app/data
      - dingir_logs:/app/logs
      - ./../../certs/ca/ca.crt:/etc/ssl/certs/thaliumx-ca.crt:ro
    networks:
      - thaliumx-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep matchengine || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  dingir-restapi:
    build:
      context: ./../../trading/dingir
      dockerfile: Dockerfile
    image: thaliumx/dingir:latest
    container_name: thaliumx-dingir-restapi
    hostname: thaliumx-dingir-restapi
    restart: unless-stopped
    command:
      - sh
      - -lc
      - |
        # Use environment variables for secrets
        export TIMESCALE_USER="dingir";
        export TIMESCALE_DB="exchange";
        export TIMESCALE_PASSWORD="${TIMESCALE_PASSWORD}";
        # Use $ to prevent docker-compose variable substitution; container shell will expand $TIMESCALE_*.
        export DATABASE_URL="postgresql://$TIMESCALE_USER:$TIMESCALE_PASSWORD@timescaledb:5432/$TIMESCALE_DB";
        export REDIS_PASSWORD="${REDIS_PASSWORD}";
        export REDIS_HOST="redis";
        export REDIS_PORT=6379;
        # Use PLAINTEXT Kafka (corrected port for current setup)
        export BROKERS="thaliumx-kafka:9092";
        # Use HTTP Vault (as in working legacy config)
        export VAULT_ADDR="http://vault:8200";
        export VAULT_TOKEN="${VAULT_TOKEN}";
        # Disable Kafka persistence to avoid startup issues
        export DINGIR_PERSIST_TO_MQ="false";
        exec ./restapi
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      RUN_MODE: ${RUN_MODE:-production}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DB_LOG: postgres://dingir:@timescaledb:5432/exchange
      DB_HISTORY: postgres://dingir:@timescaledb:5432/exchange
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    volumes:
      - dingir_data:/app/data
      - dingir_logs:/app/logs
      - ./../../certs/ca/ca.crt:/etc/ssl/certs/thaliumx-ca.crt:ro
    networks:
      - thaliumx-net
    depends_on:
      dingir-matchengine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/exchange/panel/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  liquibook:
    build:
      context: ./../../trading/liquibook
      dockerfile: Dockerfile
    image: thaliumx/liquibook:latest
    container_name: thaliumx-liquibook
    hostname: thaliumx-liquibook
    restart: unless-stopped
    environment:
      PORT: 8080
      NODE_ENV: production
      EXCHANGE_ENDPOINT: thaliumx-dingir-matchengine:50051
      VAULT_ADDR: https://vault:8200
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    volumes:
      - liquibook_data:/app/data
      - liquibook_logs:/app/logs
    networks:
      - thaliumx-net
    depends_on:
      dingir-matchengine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  quantlib:
    build:
      context: ./../../trading/quantlib
      dockerfile: Dockerfile
    image: thaliumx/quantlib:latest
    container_name: thaliumx-quantlib
    hostname: thaliumx-quantlib
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MONGO_USER: thaliumx
      MONGO_DB: thaliumx
      MONGODB_URL: mongodb://thaliumx:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/thaliumx?authSource=admin
      VAULT_ADDR: https://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: uvicorn src.main:app --host 0.0.0.0 --port 3010
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    volumes:
      - quantlib_data:/app/data
      - quantlib_cache:/app/cache
      - quantlib_models:/app/models
    networks:
      - thaliumx-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  chainanalysis:
    build:
      context: ./../../compliance-chainanalysis
      dockerfile: Dockerfile
    image: thaliumx/compliance-chainanalysis:latest
    container_name: thaliumx-compliance-chainanalysis
    hostname: thaliumx-compliance-chainanalysis
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3011
      CORS_ORIGINS: http://localhost:3000
      POSTGRES_URL: postgresql://chainanalysis:${CHAINANALYSIS_POSTGRES_PASSWORD}@postgres:5432/chainanalysis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KAFKA_BROKERS: thaliumx-kafka:9092
      GRAPHSENSE_API_URL: http://graphsense:8080
      INFURA_ETH_URL: https://mainnet.infura.io/v3/38cb2ace40b3446d900e1c500dd714ab
      INFURA_BTC_URL: https://btc-mainnet.infura.io/v3/YOUR_PROJECT_ID
      INFURA_POLYGON_URL: https://polygon-mainnet.infura.io/v3/YOUR_PROJECT_ID
      LOG_LEVEL: info
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3011:3011"
    volumes:
      - chainanalysis_data:/app/data
      - chainanalysis_logs:/app/logs
    networks:
      - thaliumx-net
    # depends_on: redis (removed - service handles missing redis gracefully)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3011/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      promtail.scrape: "true"
      logging_name: chainanalysis-service
      logging_job: compliance

volumes:
  dingir_data:
    name: thaliumx-dingir-data
  dingir_logs:
    name: thaliumx-dingir-logs
  liquibook_data:
    name: thaliumx-liquibook-data
  liquibook_logs:
    name: thaliumx-liquibook-logs
  quantlib_data:
    name: thaliumx-quantlib-data
  quantlib_cache:
    name: thaliumx-quantlib-cache
  quantlib_models:
    name: thaliumx-quantlib-models
  chainanalysis_data:
    name: thaliumx-chainanalysis-data
  chainanalysis_logs:
    name: thaliumx-chainanalysis-logs

networks:
  thaliumx-net:
    external: true
