# ThaliumX Production v1 - Trading Layer
# =====================================
# Dingir (matchengine + restapi), Liquibook, QuantLib
# Security goals:
# - Remove env_file that may contain secrets
# - Read runtime secrets from Docker secrets

version: '3.8'

services:
  dingir-matchengine:
    build:
      context: ./../../trading/dingir
      dockerfile: Dockerfile
    image: thaliumx/dingir:1.0.0
    container_name: thaliumx-dingir-matchengine
    hostname: thaliumx-dingir-matchengine
    restart: unless-stopped
    # Needs root to read Docker secrets (mounted under /run/secrets with root-only permissions on many hosts)
    user: "0:0"
    command:
      - sh
      - -lc
      - |
        # Strict audit mode: keep defaults in-container (avoid docker-compose interpolation).
        export TIMESCALE_USER="dingir";
        export TIMESCALE_DB="exchange";
        export TIMESCALE_PASSWORD="$(cat /run/secrets/postgres-password)";
        # Postgres passwords may contain URL-reserved characters. Encode before embedding in DSNs.
        export TIMESCALE_PASSWORD_ESC="$(printf %s "$$TIMESCALE_PASSWORD" | jq -sRr @uri)";
        # Dingir reads DB/kafka endpoints from config files (NOT env vars).
        # Generate `/app/config/production.yaml` at runtime so secrets never land in git.
        export DB_PASSWORD="$(cat /run/secrets/postgres-password)";
        export DB_PASSWORD_ESC="$(printf %s "$$DB_PASSWORD" | jq -sRr @uri)";
        export DB_LOG="postgresql://$$TIMESCALE_USER:$$DB_PASSWORD_ESC@timescaledb:5432/$$TIMESCALE_DB";
        export DB_HISTORY="postgresql://$$TIMESCALE_USER:$$DB_PASSWORD_ESC@timescaledb:5432/$$TIMESCALE_DB";
        export BROKERS="thaliumx-kafka:9094";

        mkdir -p /app/config;
        cat > /app/config/production.yaml <<'EOF'
        debug: false
        db_log: "__DB_LOG__"
        db_history: "__DB_HISTORY__"
        brokers: "__BROKERS__"
        EOF
        # Substitute placeholders safely (values are already URL-encoded where required).
        sed -i \
          -e "s|__DB_LOG__|$$DB_LOG|g" \
          -e "s|__DB_HISTORY__|$$DB_HISTORY|g" \
          -e "s|__BROKERS__|$$BROKERS|g" \
          /app/config/production.yaml;

        export RUN_MODE=production;
        echo "[dingir-matchengine] Using config: /app/config/production.yaml";
        echo "[dingir-matchengine] db_log=$$DB_LOG";
        echo "[dingir-matchengine] brokers=$$BROKERS";
        export REDIS_PASSWORD="$(cat /run/secrets/redis-password)";
        export REDIS_HOST="redis";
        export REDIS_PORT=6379;
        # NOTE: Dingir kafka persistence is controlled by `history_persist_policy` in config, not env vars.
        # Drop privileges for the service process
        exec su-exec dingir:dingir ./matchengine
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      RUN_MODE: ${RUN_MODE:-production}
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    volumes:
      - dingir_data:/app/data
      - dingir_logs:/app/logs
      - ./../../certs/ca/ca.crt:/etc/ssl/certs/thaliumx-ca.crt:ro
    secrets:
      - postgres-password
      - redis-password
    networks:
      - thaliumx-net
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep matchengine || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  dingir-restapi:
    build:
      context: ./../../trading/dingir
      dockerfile: Dockerfile
    image: thaliumx/dingir:1.0.0
    container_name: thaliumx-dingir-restapi
    hostname: thaliumx-dingir-restapi
    restart: unless-stopped
    # Needs root to read Docker secrets (mounted under /run/secrets with root-only permissions on many hosts)
    user: "0:0"
    command:
      - sh
      - -lc
      - |
        # Strict audit mode: keep defaults in-container (avoid docker-compose interpolation).
        export TIMESCALE_USER="dingir";
        export TIMESCALE_DB="exchange";
        export TIMESCALE_PASSWORD="$(cat /run/secrets/postgres-password)";
        # Postgres passwords may contain URL-reserved characters. Encode before embedding in DSNs.
        export TIMESCALE_PASSWORD_ESC="$(printf %s "$$TIMESCALE_PASSWORD" | jq -sRr @uri)";
        # Dingir reads DB endpoints from config files (NOT env vars).
        # Generate `/app/config/production.yaml` at runtime so secrets never land in git.
        export DB_PASSWORD="$(cat /run/secrets/postgres-password)";
        export DB_PASSWORD_ESC="$(printf %s "$$DB_PASSWORD" | jq -sRr @uri)";
        export DB_LOG="postgresql://$$TIMESCALE_USER:$$DB_PASSWORD_ESC@timescaledb:5432/$$TIMESCALE_DB";
        export DB_HISTORY="postgresql://$$TIMESCALE_USER:$$DB_PASSWORD_ESC@timescaledb:5432/$$TIMESCALE_DB";
        export BROKERS="thaliumx-kafka:9094";

        mkdir -p /app/config;
        cat > /app/config/production.yaml <<'EOF'
        debug: false
        db_log: "__DB_LOG__"
        db_history: "__DB_HISTORY__"
        brokers: "__BROKERS__"
        EOF
        sed -i \
          -e "s|__DB_LOG__|$$DB_LOG|g" \
          -e "s|__DB_HISTORY__|$$DB_HISTORY|g" \
          -e "s|__BROKERS__|$$BROKERS|g" \
          /app/config/production.yaml;

        export RUN_MODE=production;
        echo "[dingir-restapi] Using config: /app/config/production.yaml";
        echo "[dingir-restapi] db_history=$$DB_HISTORY";

        export REDIS_PASSWORD="$(cat /run/secrets/redis-password)";
        export REDIS_HOST="redis";
        export REDIS_PORT=6379;
        # Drop privileges for the service process
        exec su-exec dingir:dingir ./restapi
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      RUN_MODE: ${RUN_MODE:-production}
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    volumes:
      - dingir_data:/app/data
      - dingir_logs:/app/logs
      # Override ONLY the manage endpoint config without clobbering the baked-in DB/Kafka config.
      - ./../../trading/dingir/config/restapi/default.yaml:/app/config/restapi/default.yaml:ro
      - ./../../certs/ca/ca.crt:/etc/ssl/certs/thaliumx-ca.crt:ro
    secrets:
      - postgres-password
      - redis-password
    networks:
      - thaliumx-net
    depends_on:
      dingir-matchengine:
        condition: service_healthy
    healthcheck:
      # restapi binds on 50053 (see src/bin/restapi.rs), and `ping` is always available.
      test: ["CMD-SHELL", "curl -sf http://localhost:50053/api/exchange/panel/ping | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  liquibook:
    build:
      context: ./../../trading/liquibook
      dockerfile: Dockerfile
    image: thaliumx/liquibook:1.0.0
    container_name: thaliumx-liquibook
    hostname: thaliumx-liquibook
    restart: unless-stopped
    environment:
      PORT: 8080
      NODE_ENV: production
      EXCHANGE_ENDPOINT: thaliumx-dingir-matchengine:50051
      VAULT_ADDR: https://vault:8200
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    volumes:
      - liquibook_data:/app/data
      - liquibook_logs:/app/logs
    networks:
      - thaliumx-net
    depends_on:
      dingir-matchengine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  quantlib:
    build:
      # NOTE: `docker/trading/quantlib` is the upstream C++ QuantLib source tree.
      # The running service implementation lives in `docker/trading/quantlib.old`.
      context: ./../../trading/quantlib.old
      dockerfile: Dockerfile
    image: thaliumx/quantlib:1.0.0
    container_name: thaliumx-quantlib
    hostname: thaliumx-quantlib
    restart: unless-stopped
    command:
      - sh
      - -lc
      - |
        uri_encode_all() {
          # Percent-encode ALL bytes of the input so passwords with any special chars are safe in DSNs.
          # Keep this dependency-free (no python/jq) for slimmer images.
          printf '%s' "$$1" | od -An -tx1 -v | tr -d ' \n' | sed 's/../%&/g'
        }

        export REDIS_PASSWORD="$(cat /run/secrets/redis-password)";
        export MONGO_INITDB_ROOT_PASSWORD="$(cat /run/secrets/mongodb-password)";

        # DSNs embed passwords in a URI -> use encoded forms only for URL construction.
        export REDIS_PASSWORD_URI="$(uri_encode_all "$$REDIS_PASSWORD")";
        export MONGO_INITDB_ROOT_PASSWORD_URI="$(uri_encode_all "$$MONGO_INITDB_ROOT_PASSWORD")";

        # Use $$ to prevent docker-compose interpolation; container shell will expand runtime vars.
        export REDIS_URL="redis://:$$REDIS_PASSWORD_URI@redis:6379/0";
        export MONGO_USER="thaliumx";
        export MONGO_DB="thaliumx";
        export MONGODB_URL="mongodb://$$MONGO_USER:$$MONGO_INITDB_ROOT_PASSWORD_URI@mongodb:27017/$$MONGO_DB?authSource=admin";
        export VAULT_ADDR="http://vault:8200";
        exec uvicorn src.main:app --host 0.0.0.0 --port 3010
    environment:
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Strict audit mode: no host-exposed ports (gateway-only exposure).
    volumes:
      - quantlib_data:/app/data
      - quantlib_cache:/app/cache
      - quantlib_models:/app/models
    secrets:
      - redis-password
      - mongodb-password
    networks:
      - thaliumx-net
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  dingir_data:
    name: thaliumx-dingir-data
  dingir_logs:
    name: thaliumx-dingir-logs
  liquibook_data:
    name: thaliumx-liquibook-data
  liquibook_logs:
    name: thaliumx-liquibook-logs
  quantlib_data:
    name: thaliumx-quantlib-data
  quantlib_cache:
    name: thaliumx-quantlib-cache
  quantlib_models:
    name: thaliumx-quantlib-models

networks:
  thaliumx-net:
    external: true
