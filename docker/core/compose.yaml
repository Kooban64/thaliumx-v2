# ThaliumX Core Services
# ======================
# Frontend (Next.js) & Backend (Node.js/Express) applications
# Build context is the parent docker directory to access shared package
# Security-hardened configuration with proper isolation

services:
  # ===================
  # FRONTEND SERVICE
  # ===================
  # Next.js application with Keycloak authentication
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3002
    image: thaliumx/frontend:latest
    container_name: thaliumx-frontend
    hostname: thaliumx-frontend
    restart: unless-stopped
    
    # Security: Run as non-root user
    user: "1001:1001"
    
    # Note: read_only disabled for Next.js SWC compatibility
    # Next.js needs to write to node_modules for SWC wasm fallback
    # read_only: true
    
    # Security: Drop all capabilities, add only what's needed
    cap_drop:
      - ALL
    
    # Security: Prevent privilege escalation
    security_opt:
      - no-new-privileges:true
    
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Runtime environment variables
      - NEXT_PUBLIC_API_URL=http://localhost:3002
    
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    
    # Security: Tmpfs for writable directories with proper ownership
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100M,uid=1001,gid=1001,mode=1777
      - /app/.next/cache:noexec,nosuid,nodev,size=200M,uid=1001,gid=1001,mode=0770
    
    networks:
      - thaliumx-net
    
    # Note: backend dependency is handled by startup order
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    labels:
      - "thaliumx.service=frontend"
      - "thaliumx.tier=application"
      - "thaliumx.security.hardened=true"

  # ===================
  # BACKEND SERVICE
  # ===================
  # Node.js/Express API with comprehensive service integrations
  backend:
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile.production
    image: thaliumx/backend:latest
    container_name: thaliumx-backend
    hostname: thaliumx-backend
    restart: unless-stopped
    
    # Security: Run as non-root user
    user: "1001:1001"
    
    # Security: Read-only root filesystem where possible
    read_only: true
    
    # Security: Drop all capabilities, add only what's needed
    cap_drop:
      - ALL
    
    # Security: Prevent privilege escalation
    security_opt:
      - no-new-privileges:true
    
    env_file:
      - ./core.env
    
    environment:
      - NODE_ENV=development
      - NODE_ENV
      - PORT=3002
      - DISABLE_RATE_LIMIT=${DISABLE_RATE_LIMIT:-false}
      # API Gateway Configuration
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002,https://thaliumx.com,https://thal.thaliumx.com
      # Vault Configuration (primary secrets source)
      - VAULT_ADDR=http://thaliumx-vault:8200
      - VAULT_MOUNT_PATH=secret
      # Database Configuration (Phase 0 stabilization: use Postgres as system-of-record)
      # Citus will be used later as an analytics/read store via CDC/Kafka.
      - DB_HOST=thaliumx-postgres
      - DB_PORT=5432
      - DB_NAME=thaliumx
      - DB_USER=thaliumx
      - DB_PASSWORD=thaliumx-db-password-2025
      # Redis Configuration
      - REDIS_HOST=thaliumx-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=thaliumx-redis-password-2025
      - REDIS_DB=0
      # Keycloak Configuration - REMOVED: Migrated to Zitadel
      # - KEYCLOAK_URL=http://thaliumx-keycloak:8080
      # - KEYCLOAK_REALM=thaliumx
      # - KEYCLOAK_CLIENT_ID=thaliumx-backend
      # - KEYCLOAK_CLIENT_SECRET=thaliumx-keycloak-secret-2025
      # - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin123
      # Kafka Configuration
      - KAFKA_BROKERS=thaliumx-kafka:9092
      - KAFKA_SSL=false
      # MongoDB Configuration
      - MONGODB_URI=mongodb://thaliumx:thaliumx-mongo-password-2025@thaliumx-mongodb:27017/thaliumx?authSource=admin
      # Typesense Configuration
      - TYPESENSE_URL=http://thaliumx-typesense:8108
      - TYPESENSE_API_KEY=thaliumx-typesense-key-2025
      # OPA Configuration
      - OPA_URL=http://thaliumx-opa:8181
      # SMTP Configuration (required for production)
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=kooban.smtp@gmail.com
      - SMTP_PASSWORD=ztpf zttv rrip spaf
      - SMTP_FROM=kooban.smtp@gmail.com
      # JWT Configuration
      - JWT_SECRET=thaliumx-jwt-secret-very-long-and-secure-key-for-production-use-2025
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - JWT_ISSUER=thaliumx
      - JWT_AUDIENCE=thaliumx-users
      # Encryption Configuration
      - ENCRYPTION_ALGORITHM=aes-256-gcm
      - ENCRYPTION_KEY=thaliumx-encryption-key-32-chars-long-secure-2025
      # Trading Services
      - DINGIR_URL=http://thaliumx-dingir-restapi:8001
      - LIQUIBOOK_URL=http://thaliumx-liquibook:8083
      - QUANTLIB_URL=http://thaliumx-quantlib:8084
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://thaliumx-otel-collector:4318
      - OTEL_SERVICE_NAME=thaliumx-backend
      # Feature Flags
      - ENABLE_VAULT=true
      - ENABLE_KAFKA=true
      - ENABLE_OTEL=true
      # Metrics
      - METRICS_TOKEN=thaliumx-metrics-token-2025
      - INTERNAL_REQUEST_TOKEN=thaliumx-internal-token-2025

    # Provide Redis password via Docker secret (avoid plaintext in env/config).
    # The application currently reads REDIS_PASSWORD from env (not *_FILE),
    # so we export it at runtime from /run/secrets/redis-password.
    secrets:
      - redis-password

    command: ["sh", "-lc", "export REDIS_PASSWORD=\"$(cat /run/secrets/redis-password)\"; export NODE_ENV=development; exec node dist/index.js"]
    
    ports:
      - "${BACKEND_PORT:-3002}:3002"
    
    # Security: Tmpfs for writable directories with proper ownership
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100M,uid=1001,gid=1001,mode=1777
      - /app/logs:noexec,nosuid,nodev,size=100M,uid=1001,gid=1001,mode=0770
    
    volumes:
      # Mount secrets directory for local development fallback (read-only)
      - ./secrets:/app/.secrets:ro
      # Mount project secrets for banking integrations (absolute path)
      - /home/ubuntu/thaliumx-v1/.secrets:/app/secrets:ro
    
    networks:
      - thaliumx-net
    
    # Note: Dependencies on external services (postgres, redis, etc.) are managed
    # at the orchestrator level via compose.yaml include order
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s  # Increased to allow all 48 services to initialize
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    
    labels:
      - "thaliumx.service=backend"
      - "thaliumx.tier=application"
      - "thaliumx.security.hardened=true"

secrets:
  redis-password:
    file: ./secrets/redis-password

networks:
  thaliumx-net:
    external: true
