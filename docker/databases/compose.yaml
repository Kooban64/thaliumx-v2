# Thaliumx Databases
# ==================
# PostgreSQL (TimescaleDB/Citus), MongoDB, Redis, Typesense

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: thaliumx-postgres
    hostname: thaliumx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thaliumx}
      # No insecure defaults
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-thaliumx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - thaliumx-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thaliumx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: thaliumx-mongodb
    hostname: thaliumx-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-thaliumx}
      # No insecure defaults
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-thaliumx}
      # Optional application user (created by init script)
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-thaliumx}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      # Mongo init scripts live in ../mongodb/init
      - ../mongodb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - thaliumx-net
    healthcheck:
      # Use CMD-SHELL so credentials are expanded at runtime from container env,
      # not interpolated into the compose file (prevents leaking via `docker inspect`).
      test:
        - "CMD-SHELL"
        - >-
          mongosh --quiet --eval "db.adminCommand('ping')" \
            -u "$MONGO_INITDB_ROOT_USERNAME" \
            -p "$MONGO_INITDB_ROOT_PASSWORD" \
            --authenticationDatabase admin >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thaliumx-redis
    hostname: thaliumx-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes --maxmemory-policy volatile-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - thaliumx-net
    healthcheck:
      # Use CMD-SHELL so the password is not baked into the healthcheck config.
      test:
        - "CMD-SHELL"
        - "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"
      interval: 10s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:27.1
    container_name: thaliumx-typesense
    hostname: thaliumx-typesense
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}
      TYPESENSE_DATA_DIR: /data
    ports:
      - "${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - typesense_data:/data
    networks:
      - thaliumx-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8108'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: thaliumx-postgres-data
  mongodb_data:
    name: thaliumx-mongodb-data
  redis_data:
    name: thaliumx-redis-data
  typesense_data:
    name: thaliumx-typesense-data

networks:
  thaliumx-net:
    external: true
