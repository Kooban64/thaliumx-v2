# Thaliumx Fintech
# ================
# Ballerine (KYC/KYB workflow), BlnkFinance (ledger)

services:
  # Ballerine PostgreSQL with plv8 extension
  ballerine-postgres:
    image: sibedge/postgres-plv8:15.3-3.1.7
    container_name: thaliumx-ballerine-postgres
    hostname: thaliumx-ballerine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BALLERINE_DB_USER:-ballerine}
      # No insecure defaults; must be provided via env/secret manager
      POSTGRES_PASSWORD: Ballerine_DB_Pass_2025_Secure_ThaliumX!
      POSTGRES_DB: ${BALLERINE_DB_NAME:-ballerine}
    ports:
      - "5433:5432"
    volumes:
      - ballerine_postgres_data:/var/lib/postgresql/data
    networks:
      - thaliumx-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballerine -d ballerine"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ballerine Workflow Service (Backend API)
  ballerine-workflow:
    image: ghcr.io/ballerine-io/workflows-service:latest
    container_name: thaliumx-ballerine-workflow
    hostname: thaliumx-ballerine-workflow
    restart: unless-stopped
    environment:
      # Vault configuration for secrets
      VAULT_ADDR: http://thaliumx-vault:8200
      # No insecure defaults; must be provided via env/secret manager (or use AppRole/Vault Agent).
      VAULT_TOKEN: s.vault_token_placeholder_for_dev
      VAULT_SECRET_PATH: kv/data/fintech/ballerine
      # Database configuration (DB_URL is built from Vault secrets in entrypoint)
      DB_USER: ballerine
      DB_HOST: thaliumx-ballerine-postgres
      DB_PORT: "5432"
      DB_NAME: ballerine
      # Non-secret configuration
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: "3000"
      COMPOSE_PROJECT_NAME: thaliumx
      # Required Ballerine configuration
      ENVIRONMENT_NAME: production
      BACKOFFICE_CORS_ORIGIN: http://localhost:3004
      WORKFLOW_DASHBOARD_CORS_ORIGIN: http://localhost:3004
      HEADLESS_EXAMPLE_CORS_ORIGIN: http://localhost:3004
      KYB_EXAMPLE_CORS_ORIGIN: http://localhost:3004
      UNIFIED_API_URL: http://thaliumx-ballerine-workflow:3000
      APP_API_URL: http://localhost:3003
      # JWT configuration
      JWT_EXPIRATION: 1d
      # Mail adapter (use log for development)
      MAIL_ADAPTER: log
      # Secrets must be injected at deploy time (Vault/CI/secret manager). No hardcoded credentials.
      # Ballerine uses DB_URL for Prisma (not DATABASE_URL)
      DB_URL: postgresql://ballerine:Ballerine_DB_Pass_2025_Secure_ThaliumX!@thaliumx-ballerine-postgres:5432/ballerine
      DATABASE_URL: postgresql://ballerine:Ballerine_DB_Pass_2025_Secure_ThaliumX!@thaliumx-ballerine-postgres:5432/ballerine
      REDIS_URL: redis://thaliumx-redis:6379
      JWT_SECRET_KEY: ballerine_jwt_secret_2025_production_secure_key_ThaliumX_64_chars_hex
      SESSION_SECRET: ballerine_session_secret_2025_production_secure_ThaliumX_32_chars
      API_KEY: ballerine_api_key_2025_production_secure_ThaliumX_48_chars_alphanum
      # BCRYPT_SALT must be a valid bcrypt salt string (29 chars): $Vers$log2(NumRounds)$saltvalue
      # Generated with: bcrypt.genSaltSync(10) - must be exactly 29 characters
      BCRYPT_SALT: "$2b$10$.8CHAioRfbSk8KiRGNqNyu"
      # HASHING_KEY_SECRET must be a valid bcrypt salt - use base64 encoded version
      # Decoded: $2b$10$BTo0mwjVDZWpkq4sqQj3Ze
      HASHING_KEY_SECRET_BASE64: JDJiJDEwJEJUbzBtd2pWRFpXcGtxNHNxUWozWmU=
      WEBHOOK_SECRET: ballerine_webhook_secret_2025_production_secure_ThaliumX_64_chars
      ENCRYPTION_KEY: ballerine_encryption_key_2025_production_secure_ThaliumX_32_chars
      WORKFLOW_TOKEN: ballerine_workflow_token_2025_production_secure_ThaliumX_48_chars
      COLLECTION_FLOW_TOKEN: ballerine_collection_flow_token_2025_production_secure_ThaliumX_48_chars
      NOTION_API_KEY: ""
      MAGIC_LINK_JWT_SECRET: ballerine_magic_link_jwt_secret_2025_production_secure_ThaliumX_64_chars
      MAGIC_LINK_AUTH_JWT_SECRET: ballerine_magic_link_auth_jwt_secret_2025_production_secure_ThaliumX_64_chars
    command: ["dumb-init", "npm", "run", "prod"]
    ports:
      - "${BALLERINE_API_PORT:-3003}:3000"
    networks:
      - thaliumx-net
    depends_on:
      ballerine-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:3000/api/v1/_health/live', (res) => { process.exit(res.statusCode === 204 || res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Ballerine Backoffice (Admin UI)
  ballerine-backoffice:
    image: ghcr.io/ballerine-io/backoffice:latest
    container_name: thaliumx-ballerine-backoffice
    hostname: thaliumx-ballerine-backoffice
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3003
      # For production, auth should be enabled unless explicitly disabled.
      VITE_AUTH_ENABLED: ${BALLERINE_BACKOFFICE_AUTH_ENABLED:-true}
    ports:
      - "${BALLERINE_BACKOFFICE_PORT:-3004}:80"
    networks:
      - thaliumx-net
    depends_on:
      ballerine-workflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # BlnkFinance (Blnk) - Open-source ledger for fintech
  # https://github.com/blnkfinance/blnk
  blnkfinance:
    build:
      context: ./blnkfinance
      dockerfile: Dockerfile
      args:
        BLNK_VERSION: v0.7.0
    image: thaliumx/blnkfinance:latest
    container_name: thaliumx-blnkfinance
    hostname: thaliumx-blnkfinance
    restart: unless-stopped
    environment:
      # Blnk configuration via environment variables
      TZ: UTC
      BLNK_SERVER_PORT: "5001"
      BLNK_DATA_SOURCE_DNS: "postgres://thaliumx:dW2QSkQnxJhaY2pP8mAt7YR9qtmbaHZ7@thaliumx-postgres:5432/thaliumx?sslmode=disable"
      BLNK_REDIS_DNS: "redis://NFqT8uZlru7Tw5cv8IHVll23BNHg2otS@thaliumx-redis:6379"
      BLNK_TYPE_SENSE_DNS: "http://thaliumx-typesense:8108"
      BLNK_TYPE_SENSE_KEY: "blnk-api-key"
      BLNK_PROJECT_NAME: "thaliumx-blnkfinance"
      BLNK_ENABLE_TELEMETRY: "false"
      BLNK_ENABLE_OBSERVABILITY: "false"
    ports:
      - "${BLNKFINANCE_PORT:-5001}:5001"
    volumes:
      - ./blnkfinance/blnk.json:/app/blnk.json:ro
      - blnkfinance_data:/app/data
    networks:
      - thaliumx-net
    depends_on:
      - ballerine-postgres
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5001/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  ballerine_postgres_data:
    name: thaliumx-ballerine-postgres-data
  blnkfinance_data:
    name: thaliumx-blnkfinance-data

networks:
  thaliumx-net:
    external: true
