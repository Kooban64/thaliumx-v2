global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 100000
    tune.ssl.default-dh-param 2048
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option http-server-close
    option forwardfor except 127.0.0.1
    timeout connect 5000
    timeout client 50000
    timeout server 50000
    timeout http-request 10000
    timeout http-keep-alive 10000
    maxconn 100000
    retries 3
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Frontend for HTTP
frontend http_front
    bind *:80
    mode http
    option httplog
    option http-server-close
    option forwardfor

    # Redirect HTTP to HTTPS
    redirect scheme https code 301 if !{ ssl_fc }

# Frontend for HTTPS
frontend https_front
    bind *:443 ssl crt /etc/ssl/certs/thaliumx.crt
    mode http
    option httplog
    option http-server-close
    option forwardfor

    # Rate limiting
    stick-table type ip size 100k expire 10m store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }

    # Security headers
    http-response set-header X-Frame-Options DENY
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"

    # Routing rules
    acl is_api hdr(host) -i api.thaliumx.com
    acl is_auth hdr(host) -i auth.thaliumx.com
    acl is_monitoring hdr(host) -i monitoring.thaliumx.com

    use_backend api_backend if is_api
    use_backend auth_backend if is_auth
    use_backend monitoring_backend if is_monitoring
    default_backend frontend_backend

# Backend for Frontend (Next.js)
backend frontend_backend
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200

    # Frontend instances
    server frontend-1 frontend-1:3000 check inter 5s fall 3 rise 2
    server frontend-2 frontend-2:3000 check inter 5s fall 3 rise 2

# Backend for API (Node.js backends)
backend api_backend
    mode http
    balance leastconn
    option httpchk GET /health
    http-check expect status 200

    # Backend instances with health checks
    server backend-1 backend-1:3002 check inter 5s fall 3 rise 2 maxconn 1000
    server backend-2 backend-2:3003 check inter 5s fall 3 rise 2 maxconn 1000
    server backend-3 backend-3:3004 check inter 5s fall 3 rise 2 maxconn 1000
    server backend-4 backend-4:3005 check inter 5s fall 3 rise 2 maxconn 1000

# Backend for Auth (Keycloak)
backend auth_backend
    mode http
    balance roundrobin
    option httpchk GET /auth/realms/thaliumx
    http-check expect status 200

    server keycloak keycloak:8080 check inter 10s fall 3 rise 2

# Backend for Monitoring (Grafana)
backend monitoring_backend
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200

    server grafana grafana:3000 check inter 10s fall 3 rise 2

# Statistics page
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST

# Health check endpoint
listen health_check
    bind *:9000
    mode http
    monitor-uri /health
    option httpchk GET /health