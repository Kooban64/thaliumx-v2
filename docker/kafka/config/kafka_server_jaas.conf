// Kafka SASL/PLAIN Authentication Configuration
// SECURITY: Passwords must be set via environment variables
// This file should be mounted read-only in the container

KafkaServer {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="${KAFKA_ADMIN_PASSWORD}"
    user_admin="${KAFKA_ADMIN_PASSWORD}"
    user_producer="${KAFKA_PRODUCER_PASSWORD}"
    user_consumer="${KAFKA_CONSUMER_PASSWORD}"
    user_backend="${KAFKA_BACKEND_PASSWORD}";
};

KafkaClient {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="${KAFKA_ADMIN_PASSWORD}";
};