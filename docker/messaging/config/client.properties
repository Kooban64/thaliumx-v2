# Kafka Client Configuration for internal operations
# Used by healthchecks and admin operations
#
# NOTE: Keep this file free of secrets.
# We use PEM trust material for client-side validation (no passwords required).

security.protocol=SSL
ssl.truststore.type=PEM
ssl.truststore.location=/etc/kafka/secrets/ca.crt

# Disable hostname verification inside the container (the broker cert is issued for thaliumx-kafka,
# while healthchecks often hit localhost).
ssl.endpoint.identification.algorithm=
