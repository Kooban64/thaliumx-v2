# Kafka Client Configuration for internal operations
# Used by healthchecks and admin operations

security.protocol=SSL
ssl.truststore.location=/etc/kafka/secrets/kafka-truststore.jks
ssl.truststore.password=changeit
ssl.truststore.type=JKS

sasl.mechanism=SCRAM-SHA-256
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="$(cat /run/secrets/kafka-password)";