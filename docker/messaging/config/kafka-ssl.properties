# Kafka SSL/TLS Configuration
# ===========================
# SSL configuration for Kafka brokers and clients
# 
# To enable SSL:
# 1. Generate certificates using the certs generation script
# 2. Mount certificates to /etc/kafka/secrets/
# 3. Update compose.yaml to use SSL listeners

# SSL Protocol
security.protocol=SSL

# Truststore configuration (CA certificate)
ssl.truststore.type=PEM
ssl.truststore.location=/etc/kafka/secrets/ca.crt

# Keystore configuration (broker certificate)
ssl.keystore.type=PEM
ssl.keystore.location=/etc/kafka/secrets/server.crt
ssl.keystore.key=/etc/kafka/secrets/server.key

# SSL Authentication
ssl.client.auth=required
ssl.endpoint.identification.algorithm=https

# Cipher suites (strong encryption)
ssl.cipher.suites=TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

# SSL Protocol versions
ssl.enabled.protocols=TLSv1.3,TLSv1.2
