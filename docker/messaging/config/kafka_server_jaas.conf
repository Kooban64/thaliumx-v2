// Kafka Server JAAS Configuration
// =================================
// This file configures SASL/PLAIN authentication for Kafka

KafkaServer {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="${KAFKA_ADMIN_PASSWORD}"
    user_admin="${KAFKA_ADMIN_PASSWORD}"
    user_thaliumx="${KAFKA_CLIENT_PASSWORD}";
};

// Client configuration for inter-broker communication
KafkaClient {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="${KAFKA_ADMIN_PASSWORD}";
};