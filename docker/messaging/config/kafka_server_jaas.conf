// Kafka Server JAAS Configuration
// ================================
// This file configures SASL/SCRAM authentication for Kafka
// Uses environment variables set by Docker

KafkaServer {
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="admin"
    password="${KAFKA_ADMIN_PASSWORD}";
};

// Client configuration for inter-broker communication
KafkaClient {
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="admin"
    password="${KAFKA_ADMIN_PASSWORD}";
};