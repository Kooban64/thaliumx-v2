# Thaliumx Redis
# ==============
# Redis cache and message queue

services:
  redis:
    image: redis:7-alpine
    container_name: thaliumx-redis
    hostname: thaliumx-redis
    restart: unless-stopped
    environment:
      # No insecure defaults; must be provided via env/secret manager
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # Use a shell wrapper so the secret isn't interpolated into the compose file.
    command:
      - sh
      - -c
      - >-
        redis-server
        --requirepass "$REDIS_PASSWORD"
        --appendonly yes
        --appendfsync everysec
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --tcp-keepalive 300
        --timeout 0
        --loglevel notice
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - thaliumx-net
    healthcheck:
      test:
        - "CMD-SHELL"
        - "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  redis_data:
    name: thaliumx-redis-data

networks:
  thaliumx-net:
    external: true
