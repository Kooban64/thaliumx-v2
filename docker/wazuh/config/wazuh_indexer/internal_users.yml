# Wazuh Indexer Internal Users
# ============================
# Password hashes generated with: plugins/opensearch-security/tools/hash.sh
# Passwords are configured in docker/.env file
#
# NOTE:
# Do NOT document plaintext passwords in-repo.
# If you change Wazuh Indexer/Dashboard credentials, regenerate the bcrypt hashes
# using the OpenSearch security tooling and update this file.

---
_meta:
  type: "internalusers"
  config_version: 2

# Admin user - full access
# Password: set out-of-band (hash must match)
admin:
  hash: "$2y$12$mna1quUv6O01GjBJyOyNv.yBb2C2dzgJhiStqBLUvIf.FTgdekgG6"
  reserved: true
  backend_roles:
    - "admin"
  description: "Admin user"

# Kibanaserver user - for dashboard
# Password: set out-of-band (hash must match)
kibanaserver:
  hash: "$2y$12$MbqlAEe3/YOM8oDYggS8Zex.6fETEOx5sS8EXN2uY2HsCDoD7hKVS"
  reserved: true
  description: "Kibanaserver user"

# Kibanaro user - read-only (using admin password for simplicity)
kibanaro:
  hash: "$2y$12$D9M3FU1nckKQp86i9shf9.yOY6qfUu81Ip3snf64IxtPmIwkcWS9m"
  reserved: false
  backend_roles:
    - "kibanauser"
    - "readall"
  attributes:
    attribute1: "value1"
    attribute2: "value2"
    attribute3: "value3"
  description: "Kibanaro user"

# Logstash user (using admin password for simplicity)
logstash:
  hash: "$2y$12$D9M3FU1nckKQp86i9shf9.yOY6qfUu81Ip3snf64IxtPmIwkcWS9m"
  reserved: false
  backend_roles:
    - "logstash"
  description: "Logstash user"

