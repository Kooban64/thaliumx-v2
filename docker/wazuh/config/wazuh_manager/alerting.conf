<!--
  Wazuh Alerting Configuration for ThaliumX
  ===========================================
  Email and webhook alerting for critical security events
-->

<ossec_config>
  <!-- Email Notification Configuration -->
  <global>
    <email_notification>yes</email_notification>
    <smtp_server>${SMTP_SERVER}</smtp_server>
    <email_from>${EMAIL_FROM}</email_from>
    <email_to>${EMAIL_TO}</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
  </global>

  <!-- Alert Levels -->
  <alerts>
    <!-- Log all alerts level 3 and above -->
    <log_alert_level>3</log_alert_level>
    <!-- Send email for alerts level 12 and above (critical) -->
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- Integration with Prometheus Alertmanager -->
  <!-- This is configured via Wazuh API webhooks -->
  <!-- Webhook URL: http://alertmanager:9093/api/v1/alerts -->
  
  <!-- Custom Alert Rules -->
  <!-- Critical events trigger immediate email notification -->
  <!-- High-severity events trigger email notification -->
  <!-- Medium-severity events are logged only -->
</ossec_config>
